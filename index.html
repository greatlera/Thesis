<style>
:root{
  --bg:#EFEDEA;
  --paper:#FFFFFF;
  --ink:#232227;
  --muted:#6E6A67;
  --line:#DAD6D1;
  --yellow:#FFC341;
  --good-bg:#D5EBA0;--good-ink:#2C5410;
  --bad-bg:#F8CFC6;--bad-ink:#8A2410;
  --c:#FFC341;--on:#232227;--soft:#FFF0C7;
  --font:"Manrope","Plus Jakarta Sans","Poppins","Avenir Next","Nunito Sans","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--font)}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#app{max-width:600px;margin:0 auto;padding:20px 18px 150px;min-height:100vh}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.15}
svg{display:block}

/* Кнопки */
.primary,.secondary,.accent{
  display:block;width:100%;min-height:58px;padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:17px;text-align:center;border:2px solid transparent;
}
.primary{background:var(--ink);color:#fff}
.accent{background:var(--yellow);color:var(--ink)}
.secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.primary:active,.secondary:active,.accent:active,.round:active{transform:scale(.98)}
.round,.icon-btn{
  flex:none;display:grid;place-items:center;border:0;border-radius:50%;background:var(--paper);color:var(--ink);
}
.round{width:58px;height:58px}
.icon-btn{width:44px;height:44px}
.round[disabled]{opacity:.35}
.textbtn{background:none;border:0;padding:12px 0;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:4px;min-height:48px}

/* Фиксированные панели */
.footer,#dock{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  padding:16px 18px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 70%,rgba(239,237,234,0));
}
.footer-in,.dock-in{max-width:564px;margin:0 auto;display:flex;gap:12px}
#dock[hidden]{display:none}

/* Главный экран */
.brand{font-size:36px;margin:2px 0 0}
.lead{margin:6px 0 0;color:var(--muted);font-size:17px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:22px 0 4px}
.day{text-align:center;font-size:13px;color:var(--muted);font-weight:600}
.day b{display:grid;place-items:center;width:100%;max-width:46px;aspect-ratio:1;margin:6px auto 0;border-radius:50%;
  background:var(--paper);color:var(--ink);font-size:16px;font-weight:700}
.day.on b{background:var(--yellow)}
.day.today{color:var(--ink)}
.day.today b{box-shadow:0 0 0 3px var(--ink)}
.week-note{margin:10px 0 0;font-size:14px;color:var(--muted)}
.warn{background:#FFE9A8;padding:12px 14px;border-radius:16px;font-size:14px;margin:16px 0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 12px}
.sec-head h2{font-size:24px}
.sec-head span{font-size:14px;color:var(--muted);font-weight:600}
.dlist{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.dcard{
  display:grid;grid-template-columns:1fr auto;align-items:end;gap:2px 12px;width:100%;
  padding:20px 20px 22px;border:0;border-radius:28px;text-align:left;background:var(--c);color:var(--on);
}
.dname{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.dpct{grid-row:1 / span 2;grid-column:2;font-size:38px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;align-self:center}
.dmeta{font-size:15px;opacity:.85;font-weight:600}
.pill{grid-column:1 / -1;display:block;height:14px;margin-top:14px;border-radius:999px;background:color-mix(in srgb,var(--on) 22%,transparent);overflow:hidden}
.pill i{display:block;height:100%;border-radius:999px;background:var(--on);transition:width .5s ease}

/* Дисциплина */
.dhead{background:var(--c);color:var(--on);border-radius:28px;padding:16px 20px 22px;margin-top:4px}
.dhead .icon-btn{margin-bottom:14px}
.dhead h1{font-size:34px}
.dhead .dmeta{margin:6px 0 0;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 0;padding:0;list-style:none}
.tile{
  position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  width:100%;height:100%;min-height:150px;padding:16px;text-align:left;
  background:var(--soft);border:2px solid transparent;border-radius:24px;color:var(--ink);
}
.tile .tn{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.tile .tt{font-size:14px;line-height:1.3;font-weight:600;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tile .ts{font-size:13px;font-weight:700;min-height:18px}
.tile.read{border:2px dashed var(--ink)}
.tile.soon{background:transparent;border:2px dashed var(--line);color:var(--muted);cursor:default}
.tile.soon .tn{color:var(--muted)}
.tile.passed{background:var(--c);color:var(--on)}
.tile .ok{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;background:var(--on);color:var(--c);display:grid;place-items:center}
.empty{margin:26px 0;color:var(--muted);font-size:17px}

/* Шаги изучения */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.pbar{flex:1;height:14px;border-radius:999px;background:rgba(35,34,39,.13);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:999px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(35,34,39,.18);transition:width .35s ease}
.pcount{flex:none;min-width:48px;text-align:right;font-weight:700;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ttl{font-size:30px;margin:0 0 6px}
.ttl-sm{margin:0 0 4px;font-size:13px;line-height:1.3;font-weight:700;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ttl-sm.meta{margin:0 0 8px;font-size:11px;font-weight:600}
.meta{margin:0 0 16px;color:var(--muted);font-size:15px;font-weight:600}
.badge{display:inline-block;margin:0 0 14px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--ink);color:#fff}
.badge.soft{background:transparent;color:var(--ink);border:2px dashed var(--ink)}
.card{
  background:var(--cb);color:var(--cf);border-radius:28px;padding:22px 22px 24px;
  -webkit-user-select:text;user-select:text;
}
.card{font-size:17px}
.card p{margin:0;font-size:1em;line-height:1.55;font-weight:500}
.card ::selection,.card::selection{background:#FFC341;color:#232227}
.chip{display:inline-block;margin-bottom:12px;padding:4px 12px;border-radius:999px;font-size:14px;font-weight:700;border:2px solid currentColor;line-height:1.3}
.card h2{font-size:1.6em;margin-bottom:10px}
.slide{animation:slide .28s ease}
@keyframes slide{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.hintline{margin:14px 4px 0;font-size:14px;color:var(--muted)}
.sheet{position:fixed;left:18px;right:18px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:12;max-width:564px;margin:0 auto;background:#fff;border-radius:24px;padding:14px;box-shadow:0 10px 30px rgba(35,34,39,.3)}
.sheet[hidden]{display:none}
.sheet textarea{margin:0 0 10px}
.vbox{display:block;background:#fff;color:#232227;border-radius:20px;padding:12px}
.vis{display:block;width:100%;height:auto;max-height:32vh;margin:0 auto}
.vis text{font-family:inherit}
.cap{margin:12px 0 0;font-size:.9em;font-weight:600;line-height:1.4}
.legend{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;font-size:.9em;font-weight:700}
.legend.two{grid-template-columns:1fr 1fr}
.legend li{display:flex;gap:8px;align-items:center}
.legend i{width:14px;height:14px;border-radius:4px;flex:none;border:2px solid #232227}
.legend b{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#FFC341;border:2px solid #232227;font-size:12px}
.bignum{display:grid;gap:10px}
.bignum div{background:#fff;border-radius:18px;padding:14px 16px;font-weight:600;line-height:1.3}
.bignum b{display:block;font-size:2em;line-height:1.1;font-weight:800;margin-bottom:2px}
.vtable{width:100%;border-collapse:separate;border-spacing:0 4px;table-layout:fixed;font-weight:700}
.vtable th,.vtable td{overflow-wrap:break-word;vertical-align:middle}
.vtable tr>:first-child{width:43%}
.vtable.t3 tr>:first-child{width:30%}
.vtable th{padding:8px 6px;text-align:left;border-radius:10px;font-size:.72em;line-height:1.3}
.vtable td{padding:8px 8px;font-size:.88em;line-height:1.3}
.tl{list-style:none;margin:6px 0 0 8px;padding:0 0 0 20px;border-left:3px solid #232227;font-weight:600}
.tl li{position:relative;padding:0 0 14px 4px;line-height:1.35}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:'';position:absolute;left:-31px;top:3px;width:14px;height:14px;border-radius:50%;background:#FFC341;border:3px solid #232227}
.tl b{display:block;font-weight:800}


/* Заметки */
textarea{
  width:100%;min-height:96px;padding:14px 16px;border:2px solid var(--line);border-radius:20px;
  background:var(--paper);resize:vertical;margin:10px 0;line-height:1.45;font-weight:500
}
textarea:focus{border-color:var(--ink);outline:none}
.items{margin-top:16px;display:grid;gap:12px}
.item{padding:14px 16px;background:var(--paper);border-radius:20px}
.item.q{border-left:8px solid var(--yellow)}
.item p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.item .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--muted)}
.lnk{background:none;border:0;padding:8px 0;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;min-height:40px;flex:none}
.lnk.danger{color:#B3260F;font-weight:700}
.topic-link{background:none;border:0;padding:0;text-align:left;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.empty-sm{color:var(--muted);font-size:15px;margin:6px 0 0}
.sub{font-size:22px;margin:26px 0 4px}
.tabs{display:flex;gap:8px;margin:18px 0 6px}
.tab{flex:1;min-height:48px;border:2px solid var(--ink);border-radius:999px;background:transparent;font-weight:700}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}

/* Плашка цитаты */
#quotebar{
  position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));z-index:20;padding:0 18px;
  opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .18s,transform .18s;
}
#quotebar.show{opacity:1;transform:none;pointer-events:auto}
.quote-btn{display:block;max-width:300px;margin:0 auto;min-height:50px;padding:10px 22px;border-radius:999px;
  background:#fff;color:var(--ink);border:2px solid var(--ink);font-weight:700;box-shadow:0 8px 22px rgba(35,34,39,.28)}

/* Тест */
.qcard{background:var(--c);color:var(--on);border-radius:28px;padding:24px 22px 26px;margin-bottom:16px}
.qcard h2{font-size:25px}
.opts{display:grid;gap:10px}
.opt{
  display:block;width:100%;text-align:left;padding:15px 18px;min-height:58px;font-size:17px;font-weight:600;
  background:var(--paper);border:2px solid transparent;border-radius:20px;
}
.opt.ok{background:var(--good-bg);border-color:#7FB02C;color:var(--good-ink)}
.opt.no{background:var(--bad-bg);border-color:#D4472A;color:var(--bad-ink)}
.opt.dim{opacity:.5}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:20px 18px calc(18px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0}
.fb.ok{background:var(--good-bg);color:var(--good-ink)}
.fb.no{background:var(--bad-bg);color:var(--bad-ink)}
.fb-in{max-width:564px;margin:0 auto}
.fb h3{font-size:22px;margin-bottom:4px}
.fb p{margin:0 0 14px;font-size:16px;font-weight:500}
.result{background:var(--c);color:var(--on);border-radius:28px;padding:26px 22px}
.result .big{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1}
.result p{margin:12px 0 0;font-size:18px}

TOPICS.arch.push({
  id: 'arch-1', n: 1,
  title: 'Пять отправных точек современной архитектуры Ле Корбюзье',
  body: [
`Ле Корбюзье — творческий псевдоним швейцарско-французского архитектора Шарля-Эдуара Жаннере (1887–1965). В 1920-е годы вместе с двоюродным братом и соавтором Пьером Жаннере он сформулировал пять принципов, которые должны были задать облик «новой архитектуры». Их называют «пятью отправными точками» или «пятью пунктами». Они были опубликованы в 1926–1927 годах и показаны на практике на выставке жилых домов Вайсенхоф в Штутгарте в 1927 году, где Ле Корбюзье построил два здания.`,
`Важно понимать: это не набор модных приёмов, а следствие нового строительного материала — железобетона, то есть бетона с вложенной в него стальной арматурой. Именно материал позволил переосмыслить, каким может быть дом.`,
`## Что было до железобетона`,
`Веками дом держался на несущих стенах — каменных или кирпичных. Стена одновременно и защищала, и удерживала всё здание, поэтому она была толстой, а окна вырезались в ней небольшими проёмами. Планировка этажей подчинялась конструкции: перегородки приходилось ставить там, где есть опора снизу, а облик фасада был жёстко связан с тем, что находится за ним.`,
`Железобетон позволил разделить эти функции: здание держит каркас из колонн и перекрытий, а стены становятся лишь оболочкой. В 1914–1915 годах Ле Корбюзье изобразил эту идею в схеме «Дом-Ино»: три плоские бетонные плиты, шесть тонких колонн и лестница — больше ничего. Название обыгрывает латинское domus («дом») и слово «домино». Всё остальное — стены, окна, перегородки — можно было расставлять свободно. Пять пунктов — это развёрнутые выводы из этой схемы.`,
`## Пять пунктов по порядку`,
`Первый пункт — пилотис. Так называют тонкие колонны, которые поднимают здание над землёй. Первый этаж освобождается: под домом можно оставить сад, проезд или стоянку, а земля не «съедается» застройкой. Кроме того, жилые помещения оказываются выше от сырости грунта.`,
`Второй — крыша-сад. Вместо скатной крыши — плоская, пригодная для использования: на ней можно устроить террасу, солярий или посадить зелень. Ле Корбюзье утверждал, что слой земли защищает бетон от резких перепадов температуры, а сама крыша «возвращает» людям зелень, которую здание отняло у участка.`,
`Третий — свободный план. Когда нагрузку несут колонны, внутренние перегородки перестают быть конструктивно важными. Их можно ставить где угодно, и на каждом этаже планировка может быть своей. Комнаты перетекают одна в другую, а не нарезаются по готовой схеме стен.`,
`Четвёртый — ленточное окно. Раз стена ничего не несёт, окно можно протянуть вдоль всего фасада. Это даёт больше света и более равномерное освещение комнаты, чем отдельные вертикальные проёмы. По этому пункту у Ле Корбюзье был принципиальный спор с французским архитектором Огюстом Перре, у которого он работал в юности: Перре отстаивал вертикальное окно как более естественное для человеческого взгляда.`,
`Пятый — свободный фасад. Колонны можно отодвинуть от наружной стены вглубь здания, а перекрытия вынести консолью. Тогда фасад перестаёт быть несущим, и его можно делать почти любым — сплошным остеклением или гладкой плоскостью, без обязательной симметрии и классического ряда колонн.`,
`## Вилла Савой — манифест из белого бетона`,
`Все пять пунктов Ле Корбюзье собрал в одном здании — вилле Савой в Пуасси близ Парижа (1928–1931). Это загородный дом семьи страхового предпринимателя Пьера Савоя. Белый параллелепипед на тонких столбах словно парит над лугом. Входная зона отодвинута вглубь, основные комнаты расположены наверху и опоясаны ленточными окнами, а этажи связывает пандус — любимое средство Ле Корбюзье, превращающее подъём в прогулку. На крыше — терраса с изогнутыми стенками, напоминающими палубу океанского лайнера: корабли он очень любил.`,
`В те же годы стала знаменитой формула «дом — машина для жилья» из книги «К архитектуре» (1923). Её часто понимают как призыв к холодному, механическому жилью. Автор имел в виду другое: дом должен быть так же продуман и функционален, как хороший станок или автомобиль.`,
`## Цена идеалов`,
`Безупречная на фотографиях вилла плохо работала в быту. Владельцы жаловались на протечки плоской крыши и сырость и писали Ле Корбюзье недовольные письма. Во время Второй мировой войны здание пострадало, затем было заброшено, и городские власти планировали снести его ради строительства школы. Спасло общественное давление: в 1965 году вилла получила статус исторического памятника Франции, а в 2016 году вошла в список Всемирного наследия ЮНЕСКО вместе с другими работами архитектора.`,
`Критика пяти пунктов сводится к тому, что принципы хороши не всегда. Плоские крыши в дождливом климате требуют очень надёжной гидроизоляции, большие ленточные остекления теряют тепло, а свободный план бывает неудобен людям, которым нужны замкнутые комнаты и хорошая звукоизоляция.`,
`## Влияние`,
`Тем не менее идеи оказались чрезвычайно живучими. Здания на опорах, свободная планировка, остекление на всю ширину фасада стали нормой в XX веке. Стеклянные «шторы», подвешенные к каркасу небоскрёбов, — прямые наследники «свободного фасада». «Пять пунктов» остаются самым кратким конспектом того, что изменил железобетон: здание перестало быть стеной и стало скелетом.`
  ],
  quiz: [
    { q: 'Что такое «пилотис» в архитектуре Ле Корбюзье?',
      ok: 'Тонкие колонны, поднимающие здание над землёй',
      bad: ['Декоративные пилястры на фасаде', 'Подвальный этаж для хозяйственных нужд', 'Стеклянный купол над лестницей'],
      e: 'Пилотис освобождают первый этаж: под домом остаётся сад, проезд или стоянка.' },
    { q: 'Что НЕ входит в «пять отправных точек» Ле Корбюзье?',
      ok: 'Симметричный фасад с колоннадой',
      bad: ['Свободный план', 'Ленточное окно', 'Крыша-сад'],
      e: 'Пять пунктов: пилотис, крыша-сад, свободный план, ленточное окно, свободный фасад. Симметричная колоннада — наоборот, классическая традиция.' },
    { q: 'В каком здании Ле Корбюзье наиболее полно воплотил все пять пунктов?',
      ok: 'Вилла Савой в Пуасси',
      bad: ['Дом над водопадом', 'Здание Баухауса в Дессау', 'Центр Помпиду'],
      e: 'Вилла Савой (1928–1931) считается эталонным воплощением его принципов.' }
  ]
});

TOPICS.arch.push({
  id: 'arch-2', n: 2,
  title: 'Золотое сечение и Модулор',
  body: [
`Золотое сечение — это такое деление отрезка на две части, при котором целое относится к большей части так же, как большая часть относится к меньшей. Численно это отношение равно примерно 1,618 (точнее, (1 + √5) / 2), а в процентах — около 62 % и 38 %. Число обозначают греческой буквой φ (фи). Оно иррационально, то есть его десятичная запись бесконечна и не повторяется.`,
`## Откуда оно известно`,
`Это отношение описал ещё Евклид около 300 года до н. э. в «Началах», назвав его «делением в крайнем и среднем отношении». Название «золотое» появилось гораздо позже: обычно его связывают с XIX веком и немецким математиком Мартином Омом. В 1509 году вышла книга монаха и математика Луки Пачоли «О божественной пропорции», для которой Леонардо да Винчи нарисовал многогранники. Именно с неё золотая пропорция вошла в круг интересов художников.`,
`У золотого сечения есть красивые математические свойства. Если от золотого прямоугольника отрезать квадрат, оставшаяся часть снова окажется золотым прямоугольником, и так можно повторять бесконечно. Отношение диагонали правильного пятиугольника к его стороне тоже равно φ. А если взять числа Фибоначчи (1, 1, 2, 3, 5, 8, 13, 21 и так далее, где каждое число — сумма двух предыдущих), то отношение соседних чисел всё точнее приближается к 1,618: 8/5 = 1,6, 13/8 = 1,625, 21/13 ≈ 1,615.`,
`## Мифы вокруг золотого сечения`,
`Часто можно услышать, что золотым сечением пользовались строители египетских пирамид, архитекторы Парфенона и авторы «Моны Лизы». Надёжных доказательств того, что они делали это намеренно, нет: измерения старых зданий обычно допускают погрешность, в которую при желании «вписывается» не только 1,618, но и другие пропорции. Зато известно, что осознанно использовали эту пропорцию в XX веке — например, Сальвадор Дали в картине «Тайная вечеря» (1955), холст которой имеет форму золотого прямоугольника.`,
`Числа Фибоначчи действительно встречаются в природе, например в спиралях семян подсолнечника или чешуек шишки. Это следствие того, как растение оптимально упаковывает новые элементы по мере роста, но это не значит, что «всё прекрасное построено по φ».`,
`## Модулор: попытка измерить архитектуру по человеку`,
`Самую известную попытку превратить золотое сечение в рабочий инструмент архитектора предпринял Ле Корбюзье. С 1943 года он вместе с небольшой группой сотрудников разрабатывал систему «Модулор» (от французских module — «модуль» и section d'or — «золотое сечение»). Первая книга вышла в 1948 году, вторая — в 1955-м. Цель была амбициозной: создать шкалу размеров, одновременно связанную с ростом человека, математически гармоничную и пригодную как для метрической, так и для дюймовой систем.`,
`За основу взяли фигуру человека. Сначала это был средний француз ростом 175 см, но потом Ле Корбюзье остановился на росте 183 см (шесть футов). По его собственному рассказу, причина в том, что герои английских детективов — красавцы-полицейские — в книгах всегда имеют рост шесть футов. Если такой человек поднимет руку, высота до кончиков пальцев составит 226 см. Пуп находится на высоте около 113 см. Эти числа 113, 183 и 226 связаны золотым сечением: 113 + 70 = 183, а 183 / 113 ≈ 1,62.`,
`Из них строят две шкалы. Красный ряд идёт от 183 см: …, 27, 43, 70, 113, 183, 296 см, и каждое следующее число равно сумме двух предыдущих. Синий ряд строится так же, но от удвоенного значения 226 см: …, 33, 53, 86, 140, 226 см. Два ряда нужны для гибкости: одна золотая последовательность даёт слишком редкие шаги, а комбинации красных и синих размеров дают больше удобных промежуточных значений высоты стола, потолка, ширины прохода.`,
`## Где применили`,
`Модулор лёг в основу «Жилой единицы» в Марселе (1947–1952) — большого жилого дома, в котором высота многих помещений равна 226 см, а на бетонной стене отпечатана сама фигура Модулора. Систему использовали и при проектировании города Чандигарх в Индии. Ле Корбюзье считал, что Модулор помогает тому, чтобы «хорошее было просто, а плохое — трудно» — по его словам, так оценил систему физик Альберт Эйнштейн в 1946 году.`,
`## Ограничения`,
`У Модулора есть очевидные границы. Он рассчитан на рост взрослого мужчины, а реальные люди различаются: пропорции, удобные для одних, ограничивают других. Это не помешало системе остаться ярким примером попытки связать архитектурный размер с телом, а не с абстрактной сеткой. Сегодня Модулор интересен прежде всего как идея: размеры дома должны иметь человеческую меру.`
  ],
  quiz: [
    { q: 'Чему приблизительно равно золотое сечение?',
      ok: 'Около 1,618',
      bad: ['Около 3,14', 'Около 1,414', 'Около 2,718'],
      e: 'φ = (1 + √5) / 2 ≈ 1,618. Другие числа — это π, √2 и число e.' },
    { q: 'Какой рост человека Ле Корбюзье в итоге положил в основу Модулора?',
      ok: '183 см (шесть футов)',
      bad: ['160 см', '175 см', '200 см'],
      e: 'Сначала он брал 175 см, но затем остановился на 183 см — шести футах.' },
    { q: 'Зачем в Модулоре две шкалы — красная и синяя?',
      ok: 'Чтобы получить больше удобных промежуточных размеров',
      bad: ['Красная — для жилых зданий, синяя — для промышленных', 'Красная — для мужчин, синяя — для женщин', 'Красная — для фасадов, синяя — для крыш'],
      e: 'Одна золотая последовательность даёт слишком редкие шаги, а две шкалы вместе дают гибкий набор размеров.' }
  ]
});
TOPICS.arch.push({
  id: 'arch-3', n: 3,
  title: 'Триада Витрувия: прочность, польза, красота',
  body: [
`Марк Витрувий Поллион — римский архитектор и инженер I века до н. э. Он служил в армии Юлия Цезаря, где строил и обслуживал осадные машины и метательные орудия, а позже, уже в правление Октавиана Августа, написал трактат «Десять книг об архитектуре». Это единственный сохранившийся архитектурный трактат античности, и именно из него в Новое время европейцы узнали, как строили и думали о строительстве древние греки и римляне.`,
`Самая известная мысль Витрувия содержится в первой книге: хорошее здание должно обладать тремя качествами. По-латыни они называются firmitas, utilitas и venustas — прочность, польза и красота. Эту формулу называют триадой Витрувия.`,
`## Прочность`,
`Прочность (firmitas) означает, что здание стоит долго и не разрушается. Витрувий связывает её с двумя вещами: надёжным основанием и правильным выбором материалов. Во второй книге он подробно описывает кирпич, известь, песок и камень, а также вулканический песок — пуццолану, добавка которой делала римский бетон способным твердеть даже под водой.`,
`Лучший пример римской прочности — Пантеон в Риме, построенный при императоре Адриане около 118–128 годов н. э. Его купол диаметром около 43 метров остаётся самым большим в мире куполом из неармированного бетона. Он стоит почти две тысячи лет.`,
`## Польза`,
`Польза (utilitas) — это удобство использования. Помещения должны быть расположены так, чтобы людям было удобно в них находиться и ничто не мешало задуманным занятиям. Для Витрувия это включало и климат: он советует выбирать место для города с учётом ветров и воды, ориентировать дома по сторонам света и учитывать, какие помещения нужны утром, а какие вечером. Отдельные книги трактата посвящены городам, жилым домам, общественным зданиям, театрам с их акустикой, водоснабжению, солнечным часам и строительным машинам.`,
`## Красота`,
`Красота (venustas) возникает, когда здание выглядит приятно, а его части подчинены общему замыслу. Для Витрувия красота — не украшение, а результат пропорций. Он вводит понятие «симметрии» в смысле соразмерности частей и целого: размеры деталей должны выражаться через единый модуль, например диаметр колонны.`,
`Самым совершенным образцом пропорций, по Витрувию, является человеческое тело. Храм должен иметь соразмерность частей такую же, как у хорошо сложённого человека. Ради такой аналогии он даже приписывает колоннам характер: дорическая похожа на сильного мужчину, ионическая — на стройную женщину, а коринфская напоминает девушку. Около 1490 года Леонардо да Винчи нарисовал знаменитого «Витрувианского человека» — фигуру с раскинутыми руками, вписанную в круг и квадрат. Рисунок иллюстрирует описание пропорций тела из третьей книги трактата. Сегодня оригинал хранится в Галерее Академии в Венеции и показывается редко, чтобы не повредить бумагу.`,
`## Как триада попала в современный мир`,
`Трактат Витрувия знали и в Средние века, но особое значение он получил в эпоху Возрождения. Первое печатное издание вышло примерно в 1486 году. Архитекторы вроде Леона Баттисты Альберти и Андреа Палладио опирались на него, изучая античные постройки. Английский дипломат и писатель Генри Уоттон в 1624 году пересказал триаду как «прочность, удобство и наслаждение» в книге «Элементы архитектуры». Благодаря такому переводу фраза закрепилась в английском языке.`,
`Витрувий перечисляет и другие принципы: порядок, расположение, евритмию (приятный ритм), симметрию, уместность и экономию. Но именно триада из трёх слов оказалась самой цепкой.`,
`## Когда качества конфликтуют`,
`Ценность триады в том, что она показывает: хорошее здание — всегда компромисс. Идеально красивый, но неудобный дом проигрывает по пользе. Дешёвый и функциональный, но недолговечный — по прочности. Показательна история дома Фарнсворт (1945–1951), который построил для врача Эдит Фарнсворт архитектор Людвиг Мис ван дер Роэ. Стеклянный дом, поднятый над землёй, считается шедевром красоты, но хозяйка осталась недовольна: бюджет вырос, в доме было жарко и тесно для быта, а берег реки время от времени затапливало. Спор между заказчицей и архитектором дошёл до суда.`,
`Современные архитекторы часто дополняют триаду. К ней относят экологичность, доступность среды для людей с ограничениями, а иногда и культурный контекст. Но три слова римлянина всё ещё остаются самой простой проверкой для любой постройки: стоит ли она, служит ли людям и радует ли глаз.`
  ],
  quiz: [

      ok: 'Прочность, польза, красота',

    { q: 'Что иллюстрирует рисунок Леонардо «Витрувианский человек»?',
      ok: 'Пропорции человеческого тела как образец для пропорций зданий',

TOPICS.arch.push({
  id: 'arch-4', n: 4,
  title: 'Принцип «форма следует за функцией» Луиса Салливана',
  body: [
`Фраза «форма следует за функцией» известна даже тем, кто никогда не интересовался архитектурой. Её автор — американский архитектор Луис Салливан (1856–1924), один из главных мастеров Чикагской школы. Он написал её в статье «Высотное офисное здание, рассмотренное с художественной точки зрения», опубликованной в 1896 году в журнале «Липпинкотс». Дословно у Салливана: форма всегда следует за функцией, и это закон.`,
`## Контекст: рождение небоскрёба`,
`После Великого чикагского пожара 1871 года город отстраивался заново, а земля в центре дорожала. Строители выяснили, что стальной каркас позволяет возводить здания намного выше каменных, а лифты делают верхние этажи пригодными для работы. Так появился небоскрёб. Но он не имел никакого прошлого: ни греческий храм, ни готический собор, ни дворец эпохи Возрождения не подходили как образец для десятиэтажной конторы. Салливан задавался вопросом, как должен выглядеть этот новый тип здания.`,
`## Что имел в виду Салливан`,
`Для него ответ был в природе. Он любил наблюдать за растениями и животными: у дуба форма определяется тем, как он растёт, у орла — полётом, и в любой живой форме внешность выражает назначение. Здание, считал он, должно быть устроено так же: наружный вид должен честно показывать, что находится внутри и для чего это нужно.`,
`Применительно к небоскрёбу он предложил делить фасад на три части. Нижние этажи с магазинами и входами — публичные, их можно сделать более нарядными и открытыми. Средние — одинаковые офисные этажи, их назначение одинаково, поэтому и фасад повторяется одинаково. Верхний этаж и карниз венчают здание, скрывая технические помещения. Вертикальные столбы фасада подчёркивали рост здания вверх. Салливан писал, что высотное здание должно быть высоким «каждым дюймом» и составлять целое от низа до верха.`,
`## Воплощение: Уэйнрайт-билдинг и другие`,
`Лучший пример — Уэйнрайт-билдинг в Сент-Луисе (1890–1891), десятиэтажное здание, которое Салливан построил вместе с партнёром Данкмаром Адлером. Вертикальные столбы, которые идут вдоль всего фасада и создают ощущение движения вверх, частично скрывают стальные колонны каркаса, а частично просто подчёркивают вертикаль. Гарантия-билдинг в Буффало (1894–1896) продолжает эту линию. А универмаг Карсон Пири Скотт в Чикаго (1899–1904) показывает другую сторону Салливана: широкие окна для витрин и роскошный чугунный орнамент на нижних этажах.`,
`## Парадокс: орнамент`,
`Позднее лозунг Салливана подхватили модернисты и превратили в аргумент против украшений. Но сам автор был мастером орнамента: его чугунные и терракотовые узоры из переплетающихся растительных мотивов считаются одними из лучших в американской архитектуре. Для Салливана орнамент не был лишним. Он считал, что украшение должно рождаться из самой конструкции, как цветок из стебля, а не «приклеиваться» поверх. Ненавидел он не узор, а ложь: когда декор изображает то, чего в здании нет.`,
`Австрийский архитектор Адольф Лоос в 1908 году пошёл дальше и объявил украшение преступлением. Это уже другая, более радикальная позиция, чем у Салливана.`,
`## Ученик и судьба`,
`В фирме Адлера и Салливана с конца 1880-х работал молодой Фрэнк Ллойд Райт, который позже называл Салливана «любимым учителем» (lieber Meister). После 1895 года партнёрство распалось, заказов становилось всё меньше, а в 1920-х Салливан жил в бедности и умер в 1924 году в чикагском отеле. Незадолго до смерти он издал автобиографию «История одной идеи».`,
`## Что осталось`,
`Принцип «форма следует за функцией» стал основой функционализма — направления, в котором архитектура 1920–1930-х годов Баухауса, Ле Корбюзье и Миса ван дер Роэ отказывалась от декора ради ясного устройства. У идеи есть и критики. В 1966 году американец Роберт Вентури ответил на лозунг Миса «меньше — значит больше» фразой «меньше — это скучно». А в 1977 году архитектурный критик Питер Блейк выпустил книгу «Форма следует за провалом», где разобрал, сколько функционалистских проектов не справились с жизнью. Но слова Салливана до сих пор помогают задать простой вопрос: почему здание выглядит именно так, как выглядит?`

      ok: 'Луису Салливану',
      bad: ['Ле Корбюзье', 'Вальтеру Гропиусу', 'Фрэнку Ллойду Райту'],

`Летом 1988 года в нью-йоркском Музее современного искусства (MoMA) открылась выставка «Деконструктивистская архитектура». Её устроили архитектор Филип Джонсон и критик Марк Вигли. Они показали работы семи архитекторов: Фрэнка Гери, Дэниела Либескинда, Рема Колхаса, Питера Эйзенмана, Захи Хадид, австрийской группы Coop Himmelb(l)au и Бернара Чуми. Хотя эти мастера не составляли единой школы, выставка закрепила за их стилем общее название.`,
`## Откуда взялось слово`,
`Название соединяет два источника. Первый — русский конструктивизм 1920-х годов с его динамичными диагоналями, балками и смелыми геометрическими композициями. Второй — философия деконструкции французского мыслителя Жака Деррида, который показывал, как тексты и понятия можно «разбирать», обнаруживая их скрытые противоречия. В архитектуре это не означает слом зданий. Скорее речь о том, что привычные правила композиции — прямой угол, симметрия, чёткое деление на пол, стены и потолок — нарочно нарушаются.`,
`Типичные приёмы: пересекающиеся объёмы под острыми углами, наклонённые стены, искажённые плоскости, ощущение, будто здание вот-вот рассыплется или взрывается изнутри. Многие такие здания трудно построить, поэтому развитие стиля во многом опиралось на компьютерное проектирование.`,
`## Заха Хадид: путь к зданиям`,
`Заха Хадид родилась в 1950 году в Багдаде в образованной семье. Она сначала изучала математику в Американском университете в Бейруте, а в 1972 году переехала в Лондон, где поступила в Архитектурную ассоциацию — школу, где преподавали Рем Колхас и Эли Зенгелис. Позже она работала с Колхасом в бюро OMA. Дипломный проект 1977 года «Тектоника Малевича» — гостиница над мостом через Темзу — был вдохновлён супрематизмом Казимира Малевича и его «архитектонами» — объёмными моделями из блоков.`,
`Её рисунки и картины 1980-х были настолько выразительными и в то же время сложными для строительства, что Хадид называли «бумажным архитектором». В 1983 году она выиграла конкурс на клуб The Peak в Гонконге, но проект так и не осуществили. Долгое время её идеи существовали только на бумаге. Первым построенным зданием стала пожарная станция для компании Vitra в Вайль-на-Рейне (Германия, 1993). Другой её конкурсный проект, оперный театр в Кардиффе, был выигран в 1994 году, но отменён из-за проблем с финансированием.`,
`## Здания, которые принесли славу`,
`Перелом произошёл в 2000-х. В 2004 году Хадид получила Притцкеровскую премию — главную награду в архитектуре — и стала первой женщиной, удостоенной её. Среди её известных построек Центр современного искусства Розенталь в Цинциннати (2003), музей MAXXI в Риме (2009–2010), за который она получила премию Стирлинга, водный центр для Олимпиады 2012 в Лондоне с волнообразной крышей и Центр Гейдара Алиева в Баку (2012).`,
`Центр Алиева — хорошая иллюстрация её почерка. Площадь перед зданием плавно «поднимается» и превращается в стены и крышу, швов и углов почти нет. Внутри большой зал почти свободен от привычных колонн, пространство перетекает как текучая поверхность. Для создания такой формы потребовались сложные расчёты и пространственный каркас, скрытый под гладкой облицовкой.`,
`## Критика и спорные моменты`,
`Здания Хадид часто становились предметом споров. Их упрекали в дороговизне, в том, что форма важнее удобства, и в работе для авторитарных правительств. Проект Национального стадиона для Токио, выигранный её бюро в 2012 году, отменили в 2015-м из-за стоимости и заменили более скромным проектом Кенго Кумы. Но и защитники у стиля есть: они считают, что его ценность в расширении самого представления о том, какой может быть архитектура.`,
`## Финал`,
`Заха Хадид умерла в Майами 31 марта 2016 года от сердечного приступа в возрасте 65 лет. Её бюро продолжило работу под руководством Патрика Шумахера, развивая направление, которое он назвал параметризмом: формы создаются алгоритмами, а не вручную. Деконструктивизм как узнаваемое течение стал сходить на нет уже в 1990-х, но его уроки остались — сегодня здание может быть наклонным, изломанным и текучим без ощущения, что оно нарушает правила.`

  body: [
`Фрэнк Ллойд Райт (1867–1959) — один из самых влиятельных американских архитекторов. Он сделал популярным понятие «органическая архитектура». Для Райта это не значило, что здание должно быть похоже на растение или животное. Он имел в виду, что здание — как живой организм: все его части связаны друг с другом и с местом, где оно стоит. Дом не должен «стоять на холме» — он должен быть частью холма.`,
`## Основные принципы`,
`Первый принцип — единство целого и частей. Форма комнат, мебель, окна, светильники, даже ковры продумываются вместе. Райт нередко сам проектировал мебель и интерьер для своих домов.`,
`Второй — связь с местом. Здание вырастает из ландшафта: оно использует его рельеф, растения, воду и камень. Райт любил использовать местные материалы и оставлять их естественный вид.`,
`Третий — честность материала. Камень должен выглядеть как камень, дерево — как дерево, бетон — как бетон. Ни имитации, ни маскировки.`,
`Четвёртый — «разрушение коробки». В традиционном доме комнаты были замкнутыми ящиками. Райт же стремился к текучему пространству, в котором помещения переходят друг в друга. Он любил приём сжатия и расширения: вход делали низким и тесным, а затем человек попадал в просторную высокую гостиную, и пространство казалось ещё больше.`,
`Пятый — горизонтальные линии. Широкие низкие крыши с большими свесами, длинные ряды окон и террасы перекликаются с линией горизонта и со слоистой структурой горных пород. Эти принципы Райт отрабатывал в «прерийных домах» начала XX века и «юсонианских» домах 1930-х — недорогих жилищах для американского среднего класса.`,
`## Дом над водопадом`,
`Самое известное воплощение этих идей — Фоллингуотер, «Дом над водопадом» в штате Пенсильвания. Его в 1935 году заказал Эдгар Кауфман — владелец питтсбургского универмага — для семейных выходных. На участке у ручья Беар-Ран семья давно отдыхала, и рассчитывала получить дом с видом на водопад. Райт же расположил его прямо над водопадом, так что шум воды стал частью жизни в доме. По рассказам помощников архитектора, увидев участок, он нарисовал основную идею всего за пару часов, когда заказчик ехал к нему в мастерскую. Строительство шло в 1936–1938 годах; архитектору в то время было около 67 лет.`,
`Дом состоит из ряда бетонных террас-консолей, нависающих над потоком. Они опираются на каменные опоры из местного песчаника, а большой камень, на котором семья любила греться на солнце, Райт оставил выступающим из пола гостиной перед камином. Каменный дымоход — вертикаль, на которую «нанизаны» горизонтальные плоскости. Металлические рамы окон окрашены в красный цвет, который Райт называл «красным чероки». Стёкла в углах сходятся без стоек, так что граница между домом и лесом кажется почти исчезающей.`,
`## Трудности и реставрация`,
`Строительство далось тяжело. Бюджет вырос в несколько раз. Кауфман пригласил независимых инженеров, которые усомнились в расчётах консолей и предлагали добавить арматуру. Райт, по преданию, был в ярости и угрожал уйти с проекта, а строители втайне усилили конструкцию. Но даже это не помогло. К концу XX века главная консоль прогнулась примерно на 18 сантиметров. В начале 2000-х годов конструкцию укрепили, натянув внутри бетона стальные тросы — этот метод называется постнапряжением.`,
`## Значение`,
`Фоллингуотер вернул Райту славу. Он находился на спаде карьеры в 1920–1930-х годах, но после этого дома в 1938 году оказался на обложке журнала Time. Позже он спроектировал здание компании Johnson Wax и музей Гуггенхайма в Нью-Йорке (открыт в 1959 году). В 1963 году сын Кауфмана передал дом природоохранной организации Western Pennsylvania Conservancy, и сегодня он открыт для посетителей. В 2019 году Фоллингуотер вошёл в список Всемирного наследия ЮНЕСКО в составе восьми построек Райта.`

TOPICS.arch.push({
  id: 'arch-7', n: 7,
  title: 'Баухаус: школа, изменившая предметный мир и среду',
  body: [
`Баухаус — немецкая школа искусства, дизайна и архитектуры, которая существовала всего 14 лет, с 1919 по 1933 год, но повлияла на облик современных вещей и зданий сильнее, чем многие учебные заведения с вековой историей. Само название Bauhaus буквально переводится как «дом строительства»: слово Bau означает «строительство», Haus — «дом».`,
`## Как всё началось`,
`Школу основал архитектор Вальтер Гропиус в 1919 году в городе Веймар. Он объединил два учебных заведения: Академию изящных искусств и Школу прикладных искусств. Идея состояла в том, чтобы преодолеть разрыв между «высоким» искусством художников и ремеслом мастеров. В программном манифесте Гропиус призывал художников вернуться к ремёслам и называл целью всякого творчества строительство. На обложке манифеста была гравюра Лионеля Фейнингера с изображением собора.`,
`Обучение строилось по необычной схеме. Каждый студент сначала проходил подготовительный курс, на котором учился работать с формой, цветом и материалами: бумагой, деревом, металлом, стеклом. Затем он выбирал мастерскую: столярную, металлическую, ткацкую, типографскую, настенной живописи и другие. В каждой мастерской преподавали двое: художник, отвечавший за форму, и мастер ремесла, отвечавший за технологию.`,
`Среди преподавателей были выдающиеся художники — Василий Кандинский, Пауль Клее, Ласло Мохой-Надь, Йозеф Альберс, Оскар Шлеммер и другие. Хотя школа называлась «Баухаус», отделение архитектуры появилось в ней лишь в 1927 году, спустя восемь лет после основания.`,
`## От ремесла к промышленности`,
`Сначала Баухаус был близок к романтике ремесленного братства. Но уже в 1923 году на выставке в Веймаре Гропиус выдвинул новый лозунг: «Искусство и техника — новое единство». Теперь целью стало проектировать вещи, которые можно выпускать машинами и сделать доступными многим. Эта идея определила облик дизайна XX века.`,
`Самые известные вещи Баухауса: стул из гнутых стальных трубок Марселя Брейера (1925–1926, позже его назвали «стулом Василий» в честь Кандинского), настольная лампа Вильгельма Вагенфельда и Карла Юкера, чайник Марианны Бранд, шрифты Герберта Байера без засечек. Любопытно, что многие эти предметы в то время были дорогими и выпускались мелкими партиями — массовыми они стали уже после закрытия школы.`,
`## Женщины в Баухаусе`,
`Школа официально принимала женщин наравне с мужчинами, и в первый год среди студентов их было даже больше. Но на практике Гропиус считал, что женщинам не следует заниматься архитектурой и тяжёлыми ремёслами, и направлял их в ткацкую мастерскую. Именно там они добились выдающихся результатов: Гунта Штёльцль, Анни Альберс и другие создавали ткани, которые вошли в историю дизайна.`,
`## Три города и три директора`,
`В 1925 году Баухаус вынужден был покинуть Веймар из-за давления местных консервативных властей и переехал в Дессау. Для школы Гропиус построил здание с мастерскими, учебными помещениями и общежитием (1925–1926); фасад с остеклением во всю высоту часто называют образцом современной архитектуры. Директорами были Гропиус (1919–1928), швейцарец Ханнес Майер (1928–1930) и Людвиг Мис ван дер Роэ (1930–1933).`,
`В 1932 году городской совет Дессау, где уже преобладали национал-социалисты, закрыл школу. Мис ван дер Роэ перевёл её в Берлин и арендовал для неё помещение бывшей телефонной фабрики. В 1933 году, после обыска и давления нового режима, школа прекратила существование: школу обвиняли в левых симпатиях, и руководство приняло решение о самороспуске.`,
`## Наследие`,
`Закрытие школы не прекратило её влияния — наоборот, оно распространило его по миру. Гропиус стал преподавать в Гарварде, Мис ван дер Роэ в Иллинойсском технологическом институте в Чикаго, Мохой-Надь основал «Новый Баухаус» в Чикаго в 1937 году, Йозеф Альберс преподавал в колледже Блэк-Маунтин. Подготовительный курс Баухауса стал основой художественного образования во многих странах. Стальная мебель, простые геометричные формы, шрифты без засечек и принцип «форма следует за функцией» стали узнаваемыми элементами современного мира. В 2019 году, к столетию основания, Баухаус отмечали десятки стран.`
  ],
  quiz: [
    { q: 'Кто основал Баухаус и когда?',
      ok: 'Вальтер Гропиус, 1919 год, Веймар',
      bad: ['Ле Корбюзье, 1925 год, Париж', 'Мис ван дер Роэ, 1930 год, Берлин', 'Василий Кандинский, 1910 год, Мюнхен'],

    { q: 'Как закончилась история Баухауса?',

      e: 'После закрытия в Дессау и переезда в Берлин школа была распущена в 1933 году.' },
    { q: 'Что верно о ранних годах Баухауса?',

      e: 'Хотя название школы связано со строительством, архитектурное отделение открылось на восьмой год.' }
  ]

TOPICS.arch.push({
  id: 'arch-8', n: 8,
  title: 'Брутализм: эстетика честного бетона',
  body: [
`Слово «брутализм» часто принимают за описание грубости и жестокости, но оно происходит от французского béton brut — «сырой бетон». Так Ле Корбюзье называл бетон, оставленный в таком виде, в каком он вышел из опалубки: без штукатурки, краски и облицовки. Его жилой дом «Жилая единица» в Марселе (1947–1952) считается одним из прародителей стиля.`,
`## Откуда взялось название`,
`Термин «новый брутализм» ввели в 1950-е годы британские архитекторы Элисон и Питер Смитсон. Критик Реймер Бэнем в 1955 году опубликовал статью «Новый брутализм», сделав стиль известным. Первым значимым примером стала школа в Хансантоне в Норфолке (1949–1954) Смитсонов: стальной каркас, кирпич и бетон, а все трубы и провода на виду. Любопытно, что слово «нейбрутализм» ещё в 1950 году применил шведский архитектор Ханс Асплунд — но уже по отношению к кирпичному дому.`,
`## Идея «честности»`,
`Для брутализма главная ценность — честность. Материалы и конструкции не маскируются. Бетон показывает фактуру досок опалубки, лестницы и инженерные системы находятся на виду, а форма здания раскрывает его внутреннее устройство. Другие признаки стиля: массивные геометрические объёмы, повторяющиеся элементы, глубокие оконные проёмы и ощущение монументальности.`,
`Брутализм был ответом и на тесные условия послевоенной эпохи. Европейские города лежали в руинах, требовалось быстро построить много жилья, школ, университетов и больниц. Бетон был дешёвым, прочным и подходил для массового строительства. К тому же многие архитекторы того времени верили, что социальные здания должны выглядеть прямо и без декоративных излишеств.`,
`## Знаменитые примеры`,
`Среди самых известных зданий этого стиля: Хабитат 67 в Монреале, построенный Моше Сафди для выставки Экспо-67 из 354 сборных бетонных модулей; Национальный театр в Лондоне Дениса Ласдана (1976); жилой комплекс Барбикан в Лондоне; Бостонская ратуша (1968); башня Трелик-тауэр в Лондоне архитектора Эрно Голдфингера; библиотека Гайзеля Калифорнийского университета в Сан-Диего. Выразительные образцы появились и в Восточной Европе: монумент Бузлуджа в Болгарии (1981), близкий брутализму по духу и мемориальные комплексы Югославии, известные как «споменики».`,
`## Закат и неприязнь`,
`К 1970-м годам брутализм начал терять популярность. Причин несколько. Бетон со временем темнеет от дождя, трескается и пачкается. Многие здания плохо обслуживались, а их суровый вид ассоциировался с бедностью и преступностью в бедных районах. Кроме того, массовое жильё в бетонных блоках часто строили без учёта нужд жителей, и общество начало видеть в нём символ планирования сверху вниз. Критики говорили, что брутализм «давит» человека.`,
`Многие здания были снесены: в 2016 году разрушили центральную библиотеку Бирмингема, а в 2017-м начали снос жилого комплекса Робин-Гуд-Гарденс, созданного самими Смитсонами. Часть его фасада сохранил музей Виктории и Альберта и показал на Венецианской архитектурной биеннале 2018 года.`,
`## Новая жизнь`,
`В 2010-х годах интерес к брутализму вернулся. Фотографии бетонных зданий стали популярны в социальных сетях, появились книги и кампании в защиту памятников, например #SOSBrutalism, а исторический статус получили многие объекты. Сторонники стиля ценят его выразительность, смелость форм и социальную идею: общественные здания должны быть доступными и честными. Ещё один аргумент — экологический. Новое строительство из бетона выбрасывает много углекислого газа, поэтому иногда выгоднее сохранить и перестроить старое здание, чем сносить.`,
`Так что слово «брутальный» в названии стиля вводит в заблуждение. Это архитектура не жёсткости, а откровенности: она ничего не скрывает, в том числе свои недостатки.`
  ],
  quiz: [
    { q: 'От какого французского выражения произошло слово «брутализм»?',
      ok: 'béton brut — «сырой бетон»',

    { q: 'Какая черта характерна для брутализма?',
      ok: 'Открытый бетон с видимой фактурой опалубки и массивные объёмы',
      bad: ['Гладкие стеклянные фасады', 'Богатый декор из лепнины', 'Лёгкие деревянные каркасы'],
      e: 'Идея стиля — честность: материалы и конструкции не маскируются.' },
    { q: 'Какое здание относится к брутализму?',
      ok: 'Хабитат 67 в Монреале',
      bad: ['Крайслер-билдинг в Нью-Йорке', 'Эйфелева башня', 'Собор Саграда Фамилия'],

TOPICS.arch.push({
  id: 'arch-9', n: 9,
  title: 'Эффект Бильбао: как один музей преобразил городскую экономику',
  body: [
`«Эффектом Бильбао» называют ситуацию, когда одно эффектное здание, особенно музей или культурный центр, привлекает туристов и инвестиции и помогает городу возродиться. Название происходит от города Бильбао на севере Испании и музея Гуггенхайма, который открылся там 18 октября 1997 года. Здание спроектировал канадско-американский архитектор Фрэнк Гери.`,
`## Город до музея`,
`Бильбао — крупнейший город Страны Басков, исторически промышленный. Он стоит на реке Нервьон, по берегам которой веками работали верфи, сталелитейные заводы и порт. В 1970–1980-е годы тяжёлая промышленность в Европе пришла в упадок, предприятия закрывались, безработица росла, а берега реки превратились в заброшенные и загрязнённые территории. К тому же регион переживал политическую напряжённость, связанную с террористической организацией ЭТА. Город нуждался в новом образе и в новых источниках дохода.`,
`## План возрождения`,
`Музей был частью масштабной программы. Власти Страны Басков решили вложить деньги в культуру и городскую инфраструктуру. Они предложили Фонду Соломона Гуггенхайма, владеющему музеями современного искусства, открыть филиал в Бильбао. Баскские власти оплатили строительство и приобретение коллекции, а фонд предоставил свою известность, опыт и часть собрания. Сумма строительства составила примерно 100 миллионов долларов.`,
`Одновременно город обновлялся и в других местах. Норман Фостер спроектировал метро (открыто в 1995 году), Сантьяго Калатрава — аэропорт и пешеходный мост Субисури, набережные превратили в парки, а на месте заброшенных заводов вырос новый деловой район Абандойбарра. Музей стал визитной карточкой, но не единственным элементом плана.`,
`## Здание Гери`,
`Музей напоминает скульптуру из изогнутых объёмов, облицованных известняком, стеклом и титановыми панелями. Титан был выбран из-за долговечности и особого серебристого оттенка, который меняется в зависимости от погоды и освещения. Известно, что на облицовку пошло около 33 тысяч тонких титановых листов, каждый толщиной примерно 0,4 мм. Чтобы спроектировать такие формы, команда Гери использовала программу CATIA, разработанную для авиационной промышленности. Это был один из первых случаев, когда подобные инструменты применили в архитектуре.`,
`На площади перед музеем стоит двенадцатиметровая скульптура Джеффа Кунса «Щенок», покрытая живыми цветами, а на набережной — «Мама» Луиз Буржуа, гигантский паук из стали и бронзы.`,
`## Результаты`,
`Успех превзошёл ожидания. Планировалось, что музей привлечёт 400–500 тысяч посетителей в год, но уже в первый год его посетило больше миллиона человек. По оценкам баскских властей, музей окупил вложения за несколько лет за счёт налогов и расходов туристов. Появились новые отели, рестораны и рабочие места в сфере услуг. Бильбао из промышленного города превратился в место паломничества любителей архитектуры.`,
`## Критика и ограничения`,
`Многие города захотели повторить успех. Однако результат повторить удавалось редко. Эксперты называют несколько причин. Во-первых, Бильбао была частью комплексной стратегии, которую поддерживали власти, а не случайным проектом. Во-вторых, музей был не просто зданием, а брендом с мировой известностью. В-третьих, к успеху привели и удачное время, и новизна: в 1997 году такой смелой архитектуры почти не было, а сегодня её много. Проекты филиалов Гуггенхайма в Хельсинки (отклонённый городским советом в 2012 и 2016 годах) и в других местах так и не были реализованы.`,
`Есть и социальная критика. Некоторые исследователи считают, что выгоды от туризма распределились неравномерно, цены на жильё выросли, а расходы на культуру велись за счёт других нужд города. Но бесспорно одно: Бильбао показал, что архитектура способна менять репутацию города, и после 1997 года мэры по всему миру стали задумываться об «эффекте Бильбао».`
  ],
  quiz: [
    { q: 'Кто спроектировал музей Гуггенхайма в Бильбао?',
      ok: 'Фрэнк Гери',
      bad: ['Заха Хадид', 'Норман Фостер', 'Ле Корбюзье'],
      e: 'Здание создал Фрэнк Гери, музей открыт в 1997 году.' },

      bad: ['Бум туризма и недостаток жилья', 'Столица Испании с развитой финансовой сферой', 'Город практически не был населён'],
      e: 'Верфи и сталелитейные заводы закрывались, река превратилась в заброшенную промзону.' },
    { q: 'Что означает «эффект Бильбао»?',

      e: 'Бильбао был частью комплексной стратегии, и многие города, пытавшиеся копировать успех, не получили такого результата.' }

TOPICS.arch.push({

  title: 'Паноптикум Иеремии Бентама: пространственный надзор',
  body: [
`Представьте здание, в котором можно наблюдать за всеми одновременно, но никто не знает, смотрят ли на него в данный момент. Именно эту идею в конце XVIII века придумал английский философ и реформатор Иеремия Бентам (1748–1832). Он назвал своё изобретение «паноптикумом», от греческих слов pan («всё») и optikos («зрительный»).`,
`## Как это придумано`,
`Основная мысль пришла к Бентаму в 1786–1787 годах, когда он гостил у младшего брата Сэмюэла в городе Кричев на территории нынешней Беларуси. Сэмюэл работал на службе у князя Григория Потёмкина и организовывал мастерские, где трудилось много неквалифицированных рабочих. Ему нужно было следить за ними с минимальным числом надзирателей. Иеремия развил эту идею в серию писем, а затем в книгу «Паноптикум, или Дом надзора» (1791).`,
`## Устройство`,
`Здание имеет форму кольца. По окружности расположены камеры, каждая из которых пронизывает всю толщину здания: окно снаружи пропускает свет, а решётчатая стенка внутрь — обзор. В центре стоит высокая башня надзора. Из неё надзиратель может видеть каждую камеру, но благодаря шторкам и особому освещению заключённые не могут разглядеть, находится ли в башне кто-то в данный момент.`,
`Принцип в том, что надзор должен быть «видимым, но непроверяемым». Заключённый видит башню, но не знает, наблюдают ли за ним. Поэтому ему приходится вести себя так, будто за ним следят постоянно. Бентам считал, что это экономит ресурсы: достаточно одного надзирателя, а порой лишь ощущения его присутствия. Надзор превращался в механизм, который работает без насилия.`,
`## Не только тюрьма`,
`Бентам предлагал использовать схему не только для тюрем. Он писал о фабриках, работных домах, больницах, школах и приютах. Он был основателем утилитаризма — философии, по которой хорошим считается то, что приносит наибольшее счастье наибольшему числу людей, — и верил, что правильно устроенная среда может исправлять людей лучше, чем наказание.`,
`## Что получилось на практике`,
`Бентам годами добивался строительства паноптикума в Англии. В 1794 году парламент выделил деньги, но проект затянулся, а затем был отвергнут. В 1813 году Бентам получил денежную компенсацию. Сам он пережил это как крупное разочарование. Тюрьма Миллбэнк в Лондоне (1816–1821), построенная позже, использовала идею частично: её план составляли шестиугольные блоки, а не круг.`,
`Тем не менее в XX веке некоторые тюрьмы действительно получили круглые планы с центральным постом. Один из известных примеров — Президио-Модело на Кубе (построена в 1926–1931 годах), где в 1950-х отбывал срок Фидель Кастро. Есть «купольные» тюрьмы в Нидерландах, например в Бреде (1886). Однако в большинстве случаев такое устройство оказалось неудобным: камеры были тесными, а обслуживание сложным.`,
`## Метафора Мишеля Фуко`,
`Вторую жизнь паноптикум получил в 1975 году, когда французский философ Мишель Фуко в книге «Надзирать и наказывать» превратил его в символ современного общества. По Фуко, власть не обязательно должна применять силу. Достаточно создать условия, при которых люди сами контролируют своё поведение, потому что знают, что за ними могут наблюдать. Эту логику он увидел в школах, больницах, армии, на заводах — везде, где используется система дисциплины.`,
`## Сегодня`,
`Слово «паноптикум» часто применяют к камерам видеонаблюдения, системам распознавания лиц, а иногда и к социальным сетям, где люди знают, что их активность видна другим. Спорить можно о том, насколько это точное сравнение. Но бентамовская идея остаётся важным примером того, как архитектура может быть инструментом власти.`,
`Напоследок любопытный факт. По завещанию Бентама его тело было сохранено особым образом: скелет одет в его одежду и посажен в шкаф со стеклянной дверцей, а голова заменена восковой. Этот «автоикон» до сих пор выставлен в Университетском колледже Лондона, с которым Бентама связывают как с вдохновителем его основания.`
  ],
  quiz: [
    { q: 'Кто придумал паноптикум?',
      ok: 'Иеремия Бентам',

      e: 'Бентам описал проект в конце XVIII века; Фуко лишь использовал его как метафору.' },
    { q: 'В чём главный принцип паноптикума?',
      ok: 'Надзиратель видит всех, а заключённые не знают, смотрят ли на них',
      bad: ['Заключённые видят друг друга и контролируют друг друга сами', 'Надзиратели ходят по камерам круглосуточно', 'Все камеры расположены в глубоком подвале'],
      e: 'Неопределённость заставляет людей вести себя так, будто за ними наблюдают постоянно.' },
    { q: 'Какой философ сделал паноптикум символом современного общества дисциплины?',
      ok: 'Мишель Фуко',
      bad: ['Иммануил Кант', 'Карл Маркс', 'Жан-Поль Сартр'],

`Маленькое чёрное платье сегодня кажется самым обычным предметом гардероба: простое, чёрное, чуть выше колена. Но в 1920-е годы такая идея выглядела почти вызовом. Считается, что платье в нынешнем виде закрепилось в моде благодаря Габриэль «Коко» Шанель (1883–1971), хотя «изобрела» его она не в буквальном смысле.`,
`## Кто такая Шанель`,
`Габриэль Шанель выросла в бедности: после смерти матери отец отдал её в приют при монастыре в Обазине. Там она научилась шить. Позже она открыла шляпный магазин в Париже (1910), затем бутики в курортных Довиле (1913) и Биаррице (1915). Её главным приёмом была простота: вместо корсетов и тяжёлых украшенных платьев она использовала трикотаж, ткань, которую раньше применяли в основном для нижнего белья и спортивной одежды.`,
`## Чёрный цвет и эпоха`,
`До XX века чёрное платье чаще всего связывалось с трауром или с одеждой прислуги. Для вечерних нарядов выбирали яркие цвета и богатую отделку. После Первой мировой войны стало меняться и отношение к женской одежде: женщины работали, водили машины, танцевали, и им нужны были свободные, лёгкие вещи. Чёрный цвет оказался практичным, строгим и в то же время элегантным.`,

`В октябре 1926 года американский Vogue опубликовал рисунок простого чёрного платья от Шанель: прямой силуэт, длинные рукава, длина около колена. Журнал сравнил его с автомобилем Ford Model T: так же, как «форд» стал машиной для всех, это платье может надеть женщина любого круга. Подпись обещала, что оно станет своего рода униформой для элегантных женщин. Именно эта публикация часто называется моментом рождения «маленького чёрного платья» как явления.`,
`## Что в нём было нового`,
`Революционной была не деталь, а принцип. Платье не подчёркивало талию и не требовало сложного нижнего белья. Оно подходило и для дня, и для вечера: менялись только аксессуары, например жемчуг, шляпа или перчатки. Шанель предлагала одежду, которую можно носить, покупать недорого (по сравнению с кутюрными платьями) и копировать. Кстати, она не возражала против копий: считала, что мода должна распространяться.`,
`Историки моды напоминают, что чёрные платья существовали и до неё, а в 1920-х годах их делали и другие дома, например Жан Пату. Шанель не открыла чёрное платье, а сделала его символом современности и универсальности.`,
`## Икона на всю жизнь`,
`Образ стал ещё популярнее благодаря кино. В фильме «Завтрак у Тиффани» (1961) Одри Хепбёрн появляется в чёрном платье, сшитом для неё Юбером де Живанши. Эта сцена закрепила платье в массовой культуре. В 1994 году принцесса Диана надела облегающее чёрное платье на приём в Лондоне; его позже стали называть «платьем мести» и обсуждали по всему миру.`,
`Сегодня маленькое чёрное платье остаётся базовой вещью: его можно носить в разных ситуациях, дополнять и менять. Именно в этом его сила: оно не заставляет человека подстраиваться под вещь, а позволяет вещи подстроиться под человека.`

TOPICS.fashion.push({

`12 февраля 1947 года в Париже, на авеню Монтень, 30, состоялся показ первой коллекции дома Кристиана Диора. Этот день часто называют датой рождения нового стиля, который вошёл в историю как New Look, то есть «новый облик».`,
`## Контекст: мода после войны`,
`Во время Второй мировой войны женская одежда была строгой и экономной. Ткань распределяли по карточкам, плечи подкладывали ватными плечиками, как у военной формы, а юбки были короткими и узкими, чтобы расходовать меньше материала. К 1947 году война закончилась, но во Франции и Великобритании продолжались ограничения. Людям хотелось вернуться к красивой жизни.`,

`Кристиан Диор (1905–1957) до этого работал в домах Роберта Пиге и Люсьена Лелонга. Собственный дом он открыл с финансовой поддержкой текстильного магната Марселя Бусака. В первой коллекции было около девяноста моделей двух линий, которые назывались «Корола» («венчик цветка») и «Восьмёрка».`,

`Квантовая запутанность — одно из самых необычных явлений физики. Две частицы могут оказаться связаны так, что результаты измерений над ними согласованы, даже если частицы находятся очень далеко друг от друга. Альберт Эйнштейн называл это «жутким дальнодействием». Но, как ни странно, эксперименты показали, что природа действительно так устроена.`,
`## Парадокс ЭПР`,
`В 1935 году Эйнштейн вместе с Борисом Подольским и Натаном Розеном опубликовал статью с вопросом: можно ли считать описание реальности в квантовой механике полным? По их рассуждению, у запутанных частиц измерение одной позволяет предсказать результат для другой. Если при этом ничто не передаётся быстрее света, то значения измеряемых величин, видимо, существовали заранее, а квантовая механика просто этого не описывает. Эту идею называют парадоксом ЭПР по первым буквам фамилий авторов. Термин «запутанность» в том же году предложил Эрвин Шрёдингер.`,
`## Как выглядит запутанность`,

`## Как проверили`,
`В 1964 году ирландский физик Джон Белл показал, что рассуждение ЭПР можно проверить экспериментом. Он вывел неравенства: если у частиц есть заранее заданные скрытые свойства, определённая корреляция не может превышать некоторую границу. Квантовая механика предсказывает нарушение этой границы.`,
`Эксперименты начались в 1970-е. Самые известные результаты получил французский физик Ален Аспе в 1981–1982 годах, а в 2015 году сразу несколько групп, в том числе в Делфте и Вене, провели опыты, закрывающие основные лазейки. Результат был одинаков: границы Белла нарушаются. В 2022 году Нобелевскую премию по физике получили Ален Аспе, Джон Клаузер и Антон Цайлингер за эксперименты с запутанными фотонами.`,

`## Зачем это нужно`,
`Запутанность стала основой квантовых технологий. В квантовой криптографии она позволяет обнаружить подслушивание, потому что измерение нарушает состояние частиц. В квантовых компьютерах запутанность используется для вычислений. В 2017 году китайский спутник «Мо-цзы» передал запутанные фотоны на расстояние около 1200 километров. Физики до сих пор спорят о том, какое философское объяснение лучше всего подходит этим результатам, но сами предсказания теории подтверждены очень точно.`

`## Гипотезы`,
`Учёные предлагали много объяснений. Испарение: горячая вода быстрее теряет массу, поэтому её остаётся меньше. Конвекция: в горячей воде сильнее перемешивание, и она равномернее остывает. Растворённые газы: нагрев удаляет часть газов, что может влиять на свойства. Переохлаждение: холодная вода может оставаться жидкой ниже нуля градусов, а горячая замерзает при более высокой температуре. Свойства водородных связей между молекулами воды тоже рассматривались как фактор.`,
`## Споры вокруг эффекта`,
`Результаты опытов с водой противоречивы. В 2016 году исследователи Берридж и Линден тщательно повторили эксперименты и не обнаружили эффекта. Они предположили, что различия связаны с погрешностями измерений, например с тем, где именно в сосуде расположен термометр. В 2012 году Королевское химическое общество Великобритании объявило конкурс на лучшее объяснение. Победил хорватский химик Никола Брегович с работой о возможных причинах.`,
`## Эффект в других системах`,
`В 2020 году американские физики Авинаш Кумар и Джон Бехгефер опубликовали в журнале Nature результаты опыта с коллоидной частицей, помещённой в оптическую ловушку. Они показали, что в определённых условиях система, начавшая с более высокой температуры, действительно достигает равновесия быстрее. Это подтверждает, что подобные эффекты возможны в физике неравновесных процессов, хотя вопрос о воде остаётся открытым.`

  quiz: [

  body: [
`CRISPR/Cas9 — это технология, которая позволяет точно изменять ДНК живых организмов: вырезать, исправлять или вставлять участки генов. Её называют «молекулярными ножницами», хотя на самом деле это скорее система поиска и разрезания по заданному адресу.`,
`## Откуда взялась идея`,

`## Как это работает`,
`Система состоит из двух основных частей. Первая — белок Cas9, который выполняет роль ножниц. Вторая — направляющая РНК, примерно из 20 «букв», которая подобна адресу. Она подбирается так, чтобы соответствовать нужному участку ДНК. Направляющая РНК приводит Cas9 к месту, находит совпадающую последовательность рядом с короткой меткой PAM и разрезает обе цепи ДНК.`,
`После разреза клетка сама чинит ДНК. Есть два основных пути. Первый, быстрый и неточный, часто вносит небольшие ошибки, из-за чего ген «выключается». Второй используется, если рядом есть образец: клетка копирует нужную последовательность с шаблона, и так можно исправить или вставить новый фрагмент.`,
`## Научный прорыв`,
`В 2012 году Дженнифер Дудна и Эммануэль Шарпантье показали, что Cas9 можно запрограммировать на разрезание выбранного участка ДНК. Это превратило природный механизм в универсальный инструмент. В 2020 году им присудили Нобелевскую премию по химии.`,
`## Применение`,

`## Риски и этика`,
`Метод не идеален. Cas9 может изредка разрезать «не те» места, что приводит к непредсказуемым последствиям. Особенно спорно редактирование эмбрионов, потому что изменения передаются потомкам. В 2018 году китайский учёный Хэ Цзянькуй объявил о рождении двух девочек с отредактированным геномом. Научное сообщество осудило этот эксперимент, а в 2019 году суд приговорил его к трём годам тюрьмы. Вопрос о границах допустимого вмешательства обсуждается и сегодня.`

TOPICS.science.push({

  title: 'Двойной щелевой эксперимент Юнга: корпускулярно-волновой дуализм',
  body: [
`Двойной щелевой эксперимент считается одним из самых наглядных опытов в физике. Физик Ричард Фейнман говорил, что в нём заключена главная загадка квантовой механики. Чтобы понять это, начнём с самого опыта.`,
`## Опыт Юнга`,
`В начале XIX века английский учёный Томас Юнг пропустил свет через две узкие параллельные щели и поставил за ними экран. Если бы свет состоял из мелких шариков, на экране появились бы две светлые полосы напротив щелей. Вместо этого он увидел чередование светлых и тёмных полос. Такой узор называют интерференционным. Он возникает, когда волны от двух щелей складываются в одних местах и гасят друг друга в других. Опыт стал сильным аргументом в пользу волновой природы света.`,
`## Электроны тоже ведут себя как волны`,
`В XX веке выяснилось, что свет состоит из квантов, фотонов, то есть имеет и корпускулярные черты. Затем оказалось, что и частицы вещества проявляют волновые свойства. В 1961 году Клаус Йонссон провёл опыт с электронами и получил интерференцию. Это был первый настоящий опыт с щелями для электронов.`,
`Ещё удивительнее результат, когда частицы отправляют по одной. В 1970-х в Болонье, а позднее в 1989 году в компании Hitachi Акира Тономура наблюдали, как каждый электрон попадает в одну точку экрана, как частица. Но когда накапливаются тысячи таких точек, из них постепенно проявляется интерференционная картина. Выходит, что каждый электрон как будто «проходит через обе щели» и интерферирует сам с собой.`,
`## Что происходит при наблюдении`,
`Если поставить детектор, определяющий, через какую щель прошла частица, интерференционная картина исчезает. На экране остаются две полосы, как у обычных частиц. Часто это объясняют словами «наблюдение меняет результат». Важно, что речь идёт не о сознании человека: любое взаимодействие, которое оставляет информацию о пути частицы, разрушает интерференцию. Это называют декогеренцией.`,
`## Как это понимать`,
`Квантовая механика описывает частицу с помощью волновой функции. Она определяет вероятность обнаружить частицу в разных местах. До измерения нельзя сказать, что частица прошла через какую-то одну щель. При измерении получается конкретный результат. Существует несколько интерпретаций, объясняющих, что стоит за этим описанием, например копенгагенская и многомировая. Предсказания у них одинаковые, поэтому выбор между ними остаётся предметом споров.`,
`## Насколько большими могут быть объекты`,
`Эксперименты проводили не только с электронами. В 1999 году группа Антона Цайлингера в Вене наблюдала интерференцию молекул фуллерена C60, состоящих из 60 атомов углерода. В 2019 году интерференцию получили для молекул массой более 25 тысяч атомных единиц. Чем крупнее объект, тем труднее изолировать его от окружения и тем быстрее исчезает квантовое поведение.`

  quiz: [

TOPICS.science.push({

  body: [
`Фотосинтез — это процесс, с помощью которого растения, водоросли и некоторые бактерии превращают энергию света в химическую энергию. Благодаря ему на Земле есть кислород в воздухе и пища для большинства живых существ. Суммарно процесс можно записать так: углекислый газ плюс вода плюс свет дают сахар и кислород.`,
`## Где это происходит`,
`У растений фотосинтез идёт в клеточных органоидах — хлоропластах. Внутри хлоропласта есть стопки плоских мешочков, тилакоидов, в мембранах которых находится зелёный пигмент хлорофилл. Пространство вокруг тилакоидов называют стромой. Зелёный цвет листьев получается потому, что хлорофилл поглощает в основном красный и синий свет, а зелёный отражает.`,
`## Первая стадия: световая`,
`Она идёт в мембранах тилакоидов и требует света. Хлорофилл поглощает свет, и энергия используется для расщепления воды на кислород, протоны и электроны. Кислород выделяется в воздух, поэтому весь кислород, который выделяют растения, образуется из воды, а не из углекислого газа. Это показали в 1941 году опыты с изотопом кислорода-18.`,
`Электроны проходят по цепочке переносчиков, и за счёт этого создаётся запас энергии в двух переносимых «валютах»: молекулах АТФ и НАДФ·Н. АТФ — универсальный энергоноситель клетки, а НАДФ·Н несёт электроны для следующего этапа.`,
`## Вторая стадия: цикл Кальвина`,
`Её часто называют тёмной фазой, но это название вводит в заблуждение: темнота для неё не нужна. Просто для неё напрямую не нужен свет, зато нужны АТФ и НАДФ·Н, а они образуются на свету. Цикл идёт в строме и назван в честь Мелвина Кальвина, получившего за это открытие Нобелевскую премию по химии в 1961 году.`,
`Главную роль играет фермент рубиско. Он присоединяет углекислый газ к пятиуглеродной молекуле. Дальше с помощью АТФ и НАДФ·Н получаются трёхуглеродные сахара, из которых строятся глюкоза, крахмал и другие вещества. Рубиско считается самым распространённым ферментом на Земле.`,
`## Особые приёмы растений`,
`В жаркой сухой среде растения закрывают устьица, чтобы не терять воду, и углекислого газа внутри листа становится меньше. Тогда рубиско начинает путать молекулы и работает хуже. Некоторые растения, например кукуруза и сахарный тростник (С4-растения), научились концентрировать углекислый газ. Кактусы и другие растения с САМ-фотосинтезом (CAM) открывают устьица ночью и запасают углерод.`,
`## Эффективность`,
`Растения используют в среднем только около 1–2 % падающей солнечной энергии, превращая её в биомассу. Но масштаб огромен: фотосинтез ежегодно связывает сотни миллиардов тонн углекислого газа и обеспечивает большую часть пищевых цепей на планете.`

TOPICS.science.push({
  id: 'science-7', n: 7,
  title: 'Эффект Доплера: почему меняется тон сирены скорой помощи',
  body: [
`Когда мимо вас проезжает машина скорой помощи, тон сирены сначала звучит выше, а затем резко становится ниже. Источник звука при этом не меняется, а меняется то, как волны доходят до вашего уха. Это явление называется эффектом Доплера.`,
`## Кто его открыл`,
`Австрийский физик Кристиан Доплер описал эффект в 1842 году в Праге. Он применял идею к свету звёзд и считал, что цвет звезды связан с её движением. Для света всё оказалось сложнее, но идея была верной для волн в целом. Проверить её на звуке решил голландский учёный Бёйс-Баллот в 1845 году: он посадил трубачей в открытый вагон поезда и попросил их играть одну и ту же ноту, пока поезд едет мимо слушателей. Те услышали изменение высоты тона.`,
`## Почему меняется тон`,
`Звук — это волна, и высота тона зависит от частоты, то есть от того, сколько гребней волны достигает уха за секунду. Если источник приближается, он «догоняет» собственные волны, и расстояние между гребнями сокращается. Частота растёт, тон выше. Когда источник удаляется, расстояние между гребнями увеличивается, частота падает, тон ниже. Сам источник издаёт один и тот же звук.`,
`## Простой расчёт`,

`## Красота и ореол`,

TOPICS.psych.push({

  title: 'Когнитивный диссонанс Леона Фестингера',
  body: [
`Каждый из нас хотя бы раз делал то, что не согласуется с его убеждениями: курил, зная о вреде, или тратил деньги на ненужную вещь, считая себя бережливым. В такие моменты возникает неприятное напряжение. Американский психолог Леон Фестингер назвал его когнитивным диссонансом.`,
`## Суть теории`,

`Пример: человек курит и знает, что это вредно. Он может бросить курить, убедить себя, что вред преувеличен, или сказать: «От стресса вреднее, чем от сигарет». Последние два варианта не меняют действительность, зато уменьшают напряжение.`,
`## Когда пророчество не сбылось`,

`Потоп не случился, и тарелка не прилетела. Можно было ожидать, что члены группы разочаруются. Но самые преданные заявили, что именно их вера спасла мир, и стали активно искать новых последователей. Фестингер описал это в книге «Когда пророчество не сбывается» (1956). Чем больше человек вложил в убеждение, тем труднее ему от него отказаться.`,
`## Эксперимент за один доллар`,
`В 1959 году Фестингер и Джеймс Карлсмит дали студентам скучное задание: перекладывать катушки и вращать колышки. Затем одних попросили сказать следующему участнику, что задание интересное, и заплатили за это 1 доллар. Других попросили сделать то же, заплатив 20 долларов. Позже участников спросили, насколько им самим понравилось задание. Парадоксально, но получившие 1 доллар оценили его выше. У них не было весомого внешнего оправдания лжи, и они убедили себя, что задание правда было неплохим. Те, кто получил 20 долларов, спокойно считали, что просто сделали работу за деньги.`,
`## Притча о лисе`,
`Идея была известна давно. В басне Эзопа лиса, не достав виноград, решает, что он зелёный и кислый. Так она снимает неприятное чувство от неудачи.`,

`Бывает так: человек многого добился, но внутри остаётся ощущение, что он не заслужил своего положения, а скоро все догадаются, что он обманщик. Это состояние называют синдромом самозванца. Но сначала важный нюанс: это не диагноз.`,
`## Происхождение понятия`,

`## Как это проявляется`,
`Типичные признаки: списывание успехов на удачу, помощь других или случайность; игнорирование похвалы; страх, что вас раскроют; перфекционизм и боязнь допустить ошибку; перегрузка работой, чтобы «доказать» свою ценность; или, наоборот, откладывание дел из страха плохого результата.`,
`Кланс описала замкнутый круг. Человек получает задачу и тревожится. Он либо готовится слишком усердно, либо откладывает и затем делает всё в последний момент. Результат успешен. Но человек приписывает успех не способностям, а чрезмерным усилиям или везению. Уверенность не растёт, и в следующий раз цикл повторяется.`,
`## Откуда берётся`,
`Причины бывают разными. В семье могли сильно подчёркивать успехи или сравнивать детей: один «умный», другой «трудолюбивый». Среда с высокими требованиями усиливает сомнения. Чаще это чувство описывают люди, оказавшиеся в среде, где они в меньшинстве, например первое поколение в семье с высшим образованием или представители малочисленных групп. Перфекционизм и тревожность тоже повышают вероятность.`,
`## Что может помочь`,
`Советы специалистов такие. Назвать чувство и понять, что оно распространено. Вести записи успехов и обратной связи, чтобы проверять впечатления фактами. Поговорить с коллегами или наставником: часто выясняется, что они чувствуют то же самое. Учиться принимать комплименты, а не отмахиваться. И помнить, что чувство неуверенности не доказывает отсутствие компетентности.`,
`Если тревога сильная, мешает работе и сну или сопровождается подавленностью, стоит обратиться к психологу или психотерапевту.`

`Историки музыки сходятся в том, что документальных свидетельств формального церковного запрета на тритон нет. Это скорее красивый миф, который сложился позднее. В теории контрапункта тритона действительно избегали, но по музыкальным, а не религиозным причинам: он трудно интонируется и нарушает чистоту аккордов. Композиторы не боялись использовать его в нужные моменты.`,
`## Где тритон звучит`,
`Позднее композиторы начали использовать его намеренно, чтобы создать мрачное или тревожное настроение. В «Пляске смерти» Сен-Санса солист-скрипач настраивает одну струну ниже, чтобы получить тритон. В песне «Мария» из мюзикла «Вестсайдская история» Леонарда Бернстайна первые две ноты мелодии образуют тритон. Им начинается и тема мультсериала «Симпсоны». Классическую дьявольскую репутацию он закрепил в тяжёлой музыке: главный рифф песни «Black Sabbath» группы Black Sabbath построен на тритоне.`,
`## В джазе и сегодня`,
`В джазе тритон тоже важен. Приём «тритоновая замена» заменяет аккорд другим, чьи ноты образуют тот же тритон, и это создаёт яркие гармонические повороты. Так интервал, который когда-то считали проблемой, стал одним из главных источников напряжения и выразительности.`

`Автотюн (Auto-Tune) знаком каждому слушателю: роботизированный «ступенчатый» голос в современной поп-музыке и хип-хопе. Мало кто знает, что программа появилась благодаря инженеру, который искал нефть.`,
