  body: [
`Многие культуры не имеют точной даты рождения. Хип-хоп её имеет: 11 августа 1973 года, вечер, дом номер 1520 на Седжвик-авеню в нью-йоркском районе Бронкс. Там состоялась вечеринка, которую организовала Синди Кэмпбелл, а за вертушками стоял её старший брат Клайв.`,
`## Кто такой Kool Herc`,
`Клайв Кэмпбелл родился на Ямайке и в 1967 году переехал с семьёй в Нью-Йорк. Он взял псевдоним DJ Kool Herc. В детстве на Ямайке он видел «саундсистемы», передвижные установки с мощными колонками, на которых диджеи играли музыку для танцев. Эту традицию он перенёс в Бронкс.`,
`## Вечеринка`,

`## Революционный приём`,
`Херк использовал две одинаковые пластинки на двух проигрывателях. Когда на первой заканчивался брейк, он включал тот же момент на второй и так бесконечно продлевал самую энергичную часть. Этот приём он назвал «карусель». Танцоры, позже названные би-боями, придумывали для брейков особые движения, из чего вырос брейкданс.`,
`## Четыре элемента`,
`Рядом с Херком стояли и говорили в микрофон люди, которых называли эм-си: они подбадривали публику, называли имена и рифмовали фразы. Так появился рэп. Диджеинг, эм-синг, брейкданс и граффити называют четырьмя элементами хип-хопа. Иногда добавляют пятый: знание, то есть осведомлённость о культуре.`,
`## Контекст Бронкса`,

`## Другие основатели`,
`Grandmaster Flash разработал технику точного смешивания и быстрого перебора фрагментов пластинок. Африка Бамбаатаа создал сообщество «Зулу-нация» и использовал хип-хоп как альтернативу уличным бандам. Гранд Визард Теодор, по распространённой версии, придумал скретчинг, то есть звук, возникающий при движении пластинки руками туда-сюда.`,
`## Первые записи и память о месте`,
`Первая коммерчески успешная рэп-пластинка «Rapper's Delight» группы Sugarhill Gang вышла в 1979 году. Дом на Седжвик-авеню позднее получил статус исторического памятника как место рождения хип-хопа. Сегодня это одна из самых влиятельных культур мира: от моды до политики.`

  body: [
`Шесть секунд барабанной игры из малоизвестной песни 1969 года звучат в сотнях композиций: от хип-хопа до драм-н-бейса, от рекламы до заставки мультсериала. Это знаменитый «Amen Break», или «Эймен-брейк».`,

`## Путь по жанрам`,
`В конце 1980-х «Amen Break» зазвучал в хип-хопе. Одним из известных примеров стала песня «Straight Outta Compton» группы N.W.A. (1988). Настоящий взрыв популярности случился в начале 1990-х годов в британской рейв-культуре. Продюсеры джангла и драм-н-бейса ускоряли брейк, нарезали его на части и пересобирали, создавая сложные быстрые ритмы. Брейк слышен в десятках тысяч треков, а также в рекламе и в телесериалах, например в заставке мультсериала «Футурама».`,

`Эта история стала одним из главных аргументов в спорах об авторском праве в музыке. Если коротким фрагментом пользуются сотни авторов, кому принадлежат права и кто должен получать плату?`,
`## Почему он так популярен`,
`Брейк удобен: у него чёткий динамичный ритм, он хорошо звучит в разных темпах, а его можно разрезать на отдельные удары и собирать заново. Кроме того, Эймен стал культурным кодом: по нему слушатели узнают жанр и эпоху. Сегодня он остаётся примером того, как короткий фрагмент превращается в общий язык музыкантов.`

TOPICS.music.push({
  id: 'music-7', n: 7,
  title: 'Терменвокс Льва Термена: музыка без прикосновения к инструменту',
  body: [
`Музыкант стоит перед странным ящиком с двумя антеннами и двигает руками в воздухе. Он не касается инструмента, но из динамика льётся протяжный, дрожащий звук. Это терменвокс, один из первых электронных музыкальных инструментов, изобретённый в России.`,
`## Изобретатель`,
`Лев Сергеевич Термен (1896–1993) родился в Петербурге, учился физике и музыке. В 1920 году, работая в Петрограде над прибором для измерения плотности газов, он заметил, что изменение положения его руки рядом с устройством меняет высоту звука. Так возникла идея музыкального инструмента.`,
`## Как он устроен`,
`Терменвокс содержит два высокочастотных генератора. Звуковой сигнал получается из разности их частот. Один генератор имеет вертикальную антенну. Рука исполнителя вблизи антенны работает как одна из обкладок конденсатора и меняет частоту генератора. Чем ближе рука, тем выше звук. Второй контур с петлёй управляет громкостью: чем ближе рука к петле, тем тише звук. Так левая рука «играет» громкость, а правая, высоту.`,
`Играть на таком инструменте очень трудно: нет клавиш и струн, а точность зависит только от положения руки в воздухе. Исполнитель должен хорошо слышать и точно контролировать движения.`,
`## Успех и гастроли`,
`В 1922 году Термен показал изобретение Ленину, который, по рассказам, попробовал сыграть на нём. В 1920-е годы он гастролировал по Европе, а в 1927 году приехал в США. Американская компания RCA в 1929 году выпустила коммерческую версию. Особенно прославилась виртуозная исполнительница Клара Рокмор, родившаяся в 1911 году в Вильнюсе.`,
`## Загадочная судьба`,
`В 1938 году Термен вернулся в СССР при загадочных обстоятельствах. Много лет он работал в закрытых лабораториях. Он создал подслушивающее устройство, получившее название «Вещь» (The Thing). В 1945 году его скрыли в резном гербе США, подаренном советскими школьниками американскому послу, и устройство прослужило до 1952 года, когда его обнаружили. Термен прожил 97 лет и в последние годы снова давал концерты.`,
`## Звук в кино и музыке`,

`Слушая музыку, мы легко отличаем весёлую мелодию от грустной. Часто это зависит от того, в мажоре или в миноре она написана. Но откуда берётся такая связь и одинакова ли она у всех людей?`,

`Джаз можно узнать по одной особенности, которую трудно описать словами, но легко почувствовать: у музыки есть «качание», заставляющее притоптывать ногой. Это ощущение называют свингом. Основу ему даёт синкопа.`,
`## Что такое синкопа`,
`В обычной метрике сильные доли тактов совпадают с ударами. Синкопа это смещение акцента на слабую долю или на промежуток между долями. Представьте, что вы хлопаете в ладоши на «раз-и-два-и-три-и-четыре», но акцентируете не «раз», а «и». Получается непредсказуемый и энергичный ритм, будто мелодия постоянно «запаздывает» или «забегает вперёд».`,
`## Африканские корни`,

`## Что такое свинг`,
`Свингом называют особую манеру исполнять ритм. В обычной записи две восьмые ноты равны по длине. В свинге первая восьмая получается длиннее второй, примерно как в триоли, когда первые две доли триоли объединены. Соотношение примерно два к одному, но оно не постоянно. Исследования показывают, что в медленном темпе разница выше, а в быстром ноты сближаются почти до равных.`,
`Поэтому свинг нельзя записать нотами точно. Музыканты обычно играют восьмые ровно, а ощущение возникает из исполнения. Его определяют и другие приёмы: «ходячий бас» на каждую долю, характерный рисунок тарелки райд («динь, динь-а-динь») и акценты на второй и четвёртой долях.`,

`## Как услышать свинг`,
`Попробуйте послушать одну и ту же мелодию в исполнении с ровными восьмыми, а потом в манере свинга. Во втором случае музыка кажется более плавной и живой. Это и есть эффект свинга: не нотная запись, а способ играть.`

`Кулешов описывал и другие приёмы. Один из них называют «творческой географией»: монтажом кадров, снятых в разных местах, можно создать единое пространство. Например, мужчина идёт по одной улице, женщина по другой, они встречаются у здания, снятого третьим, и зритель верит в то, что всё происходит в одном месте.`,

`Когда два героя разговаривают в кино, зритель всегда знает, кто где стоит: один слева, другой справа. Он даже не задумывается об этом. За этим стоит простое правило, которое операторы и режиссёры называют правилом 180 градусов.`,
`## Воображаемая линия`,
`Представьте двух людей, сидящих друг напротив друга. Проведите между ними воображаемую линию. Её называют осью действия или линией взгляда. По правилу, камера в течение сцены должна находиться по одну сторону от этой линии, в пределах полукруга в 180 градусов. Если камера остаётся на одной стороне, то герой А всегда виден слева, а герой Б справа, независимо от ракурса.`,
`## Что будет, если нарушить правило`,
`Если камера внезапно перескочит на другую сторону оси, герои поменяются местами на экране. Зритель на секунду теряет ориентацию: кто куда смотрит и где находится. Особенно заметно это в сценах с движением. Допустим, автомобиль едет слева направо. Если следующий кадр снят с другой стороны оси, машина поедет справа налево, и зритель подумает, что она развернулась.`,
`## Как работает на практике`,
`Правило важно для сцены диалога. Обычно её снимают приёмом «план — контрплан» (в английском shot / reverse shot): сначала показывают одного героя, затем другого, снимая с точек, расположенных по одну сторону оси. Взгляды героев направлены друг к другу: один смотрит направо, другой налево. Это создаёт у зрителя впечатление, что они действительно разговаривают.`,
`Похожая логика действует в сценах погони, когда направление движения нужно сохранять. Если героя преследуют, и он бежит вправо, то и в следующих кадрах он должен двигаться вправо.`,
`## Как пересечь линию законно`,
`Режиссёры придумали способы переходить на другую сторону оси. Можно показать нейтральный кадр, например, снятый точно по оси или общий план. Можно двигать камеру по дуге через ось, чтобы зритель видел, как меняется положение. Можно вставить крупный план предмета или врезку. Можно изменить расстановку героев в кадре: если они встали или поменялись местами, ось тоже меняется.`,
`## Когда правило нарушают`,
`Правило не закон природы. Иногда его нарушают сознательно. Японский режиссёр Ясудзиро Одзу часто снимал диалоги так, что герои смотрели почти прямо в камеру, а ось действия вела себя непривычно. Такие решения создают эффект дезориентации, отчуждения или особого стиля. Но для этого режиссёр должен хорошо знать правило.`,
`## Смежные правила`,
`Рядом с правилом 180 градусов существует «правило 30 градусов»: при смене ракурса камеру нужно сдвигать не меньше чем на 30 градусов, иначе склейка будет выглядеть как скачок. Вместе эти правила делают так называемый «незаметный монтаж», при котором зритель следит за историей, а не за камерой.`
  ],

`Альфреда Хичкока (1899–1980) называли «мастером саспенса». Он считал, что умеет управлять тревогой зрителя, как музыкант управляет мелодией. Сам Хичкок объяснял секрет с помощью простого примера.`,
`## Бомба под столом`,

`Теперь изменим сцену. Зрителям заранее показывают, что под столом лежит бомба, и сколько времени осталось до взрыва. Герои по-прежнему говорят о пустяках. Теперь зритель чувствует тревогу, ему хочется крикнуть: «Не сидите там!» Одна и та же сцена превращается в напряжение, которое может длиться пятнадцать минут. Это и есть саспенс.`,

`Страх отличается от саспенса. Страх это реакция на непосредственную угрозу, например, внезапное появление чудовища. Саспенс это ожидание угрозы, которое нарастает, пока зритель думает: «Что будет дальше?» Для саспенса важно, чтобы зрителю было не всё равно, что произойдёт с героями.`,
`## Приёмы Хичкока`,

TOPICS.cinema.push({

  body: [
`В кино бывает предмет, ради которого все бегут, дерутся и рискуют жизнью. Но если спросить, что это такое, ответ окажется почти неважным. Такой предмет называют Макгаффином. Термин связан с именем Альфреда Хичкока, хотя придумал его не он.`,
`## Откуда слово`,
`Слово «Макгаффин» (MacGuffin) предложил шотландский сценарист Ангус Макфейл, друг Хичкока. Хичкок прославил его в лекции в Колумбийском университете в 1939 году. Там он рассказал анекдот. Два пассажира едут в поезде. Один спрашивает другого: «Что за свёрток на полке?» «Это Макгаффин». «А что это такое?» «Это приспособление для ловли львов в Шотландском нагорье». «Но в Шотландском нагорье нет львов». «Значит, это не Макгаффин».`,
`## Что это значит`,

  'fashion-1': [

  'social-3': [

  'cinema-8': [
    { after: 2, text: `Нуар во многом диктовался бюджетом. Небольшие студии использовали недорогие декорации, и тени помогали скрыть бедность оформления. Темнота не только создавала настроение, но и экономила деньги. Многие классические нуары были «картинами категории B», снятыми быстро и дёшево.` },
    { after: 5, text: `Нуар повлиял на комиксы и компьютерные игры. Атмосфера мрачного города, детектива-одиночки и дождя встречается в историях о Бэтмене, в играх вроде L.A. Noire и в аниме «Ковбой Бибоп». Настроение нуара оказалось сильнее, чем рамки одного десятилетия.` }
  ],
  'cinema-9': [
    { after: 2, text: `Хичкок любил небольшие появления в собственных фильмах: он мелькает в кадре на несколько секунд, например, входит в вагон или проходит по улице. Эти «камео» стали его фирменной шуткой и способом сделать режиссёра узнаваемым для публики.` },
    { after: 5, text: `Для саспенса важны время и музыка. Композитор Бернард Херрманн написал для «Психо» струнную партитуру с резкими, колющими звуками, усиливающими тревогу. По преданию, Хичкок признавал, что музыка во многом спасла фильм, и сцена в душе без неё не производила бы такого впечатления.` }
  ],
  'cinema-10': [
    { after: 2, text: `Хичкок отмечал, что в шпионских фильмах Макгаффин обычно «секретные документы», в детективах «ожерелье», в приключенческих «золото». Он шутил, что лучший Макгаффин тот, который почти ничем не является. Задача зрителя не разгадывать предмет, а следить за героями.` },
    { after: 4, text: `У Макгаффина есть «родственники» в сказках и легендах: волшебный предмет, за которым отправляется герой, например Священный Грааль. Грааль нужен, чтобы запустить путешествие, а смысл путешествия, как обычно, в том, как меняется герой.` }
  ]
});

  /* ---------- Хранилище ---------- */
  var S = { progress: {}, notes: [], quotes: [], days: {}, settings: { spaced: false }, alerts: [] };
  var storeKind = 'memory';

  function localOk() {
    try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; }
  }
  async function loadState() {
    try {
      if (window.storage && typeof window.storage.get === 'function') {
        storeKind = 'artifact';
        try {
          var r = await window.storage.get(KEY, false);
          if (r && r.value) return JSON.parse(r.value);
        } catch (e) { /* ключа ещё нет */ }
        return null;
      }
    } catch (e) { /* дальше */ }
    if (localOk()) {
      storeKind = 'local';
      try { var v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; }
    }
    return null;
  }
  function saveState() {
    var json = JSON.stringify(S);
    try {
      if (storeKind === 'artifact') {
        window.storage.set(KEY, json, false).catch(function () { toast('Не удалось сохранить данные'); });
      } else if (storeKind === 'local') {
        localStorage.setItem(KEY, json);
      }
    } catch (e) { toast('Не удалось сохранить данные'); }
  }

  /* ---------- Утилиты ---------- */
  var app = document.getElementById('app');
  var dock = document.getElementById('dock');
  var quotebar = document.getElementById('quotebar');
  var toastEl = document.getElementById('toast');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function fmtDate(ts) {
    try { return new Date(ts).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }); } catch (e) { return ''; }
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function markToday() {
    var k = dateKey(new Date());
    if (!S.days[k]) { S.days[k] = 1; saveState(); }
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }
  function prog(id) { return S.progress[id] || {}; }
  function isPassed(id) { return !!prog(id).passed; }
  /* Все плитки дисциплины: готовые темы и пока пустые «скоро» */
  function tilesOf(id) {
    var titles = (window.TITLES && window.TITLES[id]) || [];
    var ready = {};
    (TOPICS[id] || []).forEach(function (t) { ready[t.n] = t; });
    var out = [];
    var count = Math.max(titles.length, (TOPICS[id] || []).length);
    for (var i = 1; i <= count; i++) {
      out.push(ready[i] || { id: id + '-' + i, n: i, title: titles[i - 1] || ('Тема ' + i), disc: id, soon: true });
    }
    return out;
  }
  function discStats(id) {
    var list = TOPICS[id] || [];
    var total = tilesOf(id).length;
    var passed = list.filter(function (t) { return isPassed(t.id); }).length;
    return { total: total, avail: list.length, passed: passed, pct: total ? Math.round(passed / total * 100) : 0 };
  }
  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }
  function discStyle(d) { return '--c:' + d.c + ';--on:' + d.on + ';--soft:' + d.soft; }

  /* ---------- Маршрутизация ---------- */
  var current = null;
  var currentTopic = null;
  var stepTopic = null, stepIdx = 0;
  var quiz = null;
  var notesTab = 'notes';

  function readHash() { return (location.hash || '#/').slice(1) || '/'; }
  function navigate(p) {
    try { if (location.hash !== '#' + p) location.hash = p; } catch (e) { /* нет доступа к hash */ }
    route(p);
  }
  function route(p) { if (p !== current) render(p); }

  function render(path, keepScroll) {
    current = path;
    currentTopic = null;
    hideQuoteBar();
    var parts = path.split('/').filter(Boolean);
    var html, showDock = false;

    if (parts.length === 0) {
      html = viewHome(); showDock = true;
    } else if (parts[0] === 'd' && DISC_BY[parts[1]]) {
      html = viewDisc(parts[1]);
    } else if (parts[0] === 't' && BY_ID[parts[1]]) {
      currentTopic = parts[1];
      html = viewTopic(parts[1]);
    } else if (parts[0] === 'q' && BY_ID[parts[1]]) {
      if (!quiz || quiz.id !== parts[1]) startQuiz(parts[1]);
      html = viewQuiz();
    } else if (parts[0] === 'review') {
      html = viewReviewStart();
    } else if (parts[0] === 'rv') {
      html = rev ? viewReviewSession() : viewReviewStart();
    } else if (parts[0] === 'settings') {
      html = viewSettings();
    } else if (parts[0] === 'notes') {
      html = viewNotes();
    } else {
      current = '/';
      html = viewHome(); showDock = true;
    }

    app.innerHTML = html;
    dock.hidden = !showDock;
    if (!keepScroll) window.scrollTo(0, 0);
    document.documentElement.classList.toggle('noscroll', !!document.querySelector('.card.fit'));
    if (currentTopic) { refreshTopicItems(); fitCard(); }
  }

  /* Подгонка шрифта: карточка должна целиком помещаться на экране */
  function fitCard() {
    var card = document.querySelector('.card.fit');
    var btn = document.querySelector('.footer-in');
    if (!card || !btn) return;
    var size = 17;
    card.style.fontSize = size + 'px';
    var limit = btn.getBoundingClientRect().top - 12;
    while (size > 11.5 && card.getBoundingClientRect().bottom > limit) {
      size -= 0.5;
      card.style.fontSize = size + 'px';
    }
    /* если даже на минимальном шрифте не помещается, разрешаем прокрутку */
    if (card.getBoundingClientRect().bottom > limit) document.documentElement.classList.remove('noscroll');
  }
  window.addEventListener('resize', function () { if (currentTopic) fitCard(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (currentTopic) fitCard(); });

  /* ---------- Главный экран ---------- */
  var DOW = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

  function viewHome() {
    var total = ALL.length;
    var passed = ALL.filter(function (t) { return isPassed(t.id); }).length;

    var now = new Date();

  /* ---------- Дисциплина ---------- */
  function viewDisc(id) {
    var d = DISC_BY[id];
    var st = discStats(id);
    var list = tilesOf(id);
    var h = '<div style="' + discStyle(d) + '">';

    h += '<h1>' + esc(d.name) + '</h1>';
    h += '<span class="dmeta">' + st.passed + ' из ' + st.total + ' пройдено, ' + st.pct + '%' + (st.avail === 0 ? '. Карточки скоро' : (st.avail < st.total ? '. Доступно тем: ' + st.avail : '')) + '</span>';
    h += '<span class="pill"><i style="width:' + st.pct + '%"></i></span></header>';

      h += '<p class="empty">Темы этой дисциплины ещё не добавлены. Их можно подключить следующей порцией.</p>';
    } else {

      list.forEach(function (t) {
        var p = prog(t.id);
        var cls = t.soon ? 'soon' : (p.passed ? 'passed' : (p.read ? 'read' : ''));
        var status = t.soon ? 'Скоро' : (p.passed ? 'Пройдена' : (p.read ? 'Тест не сдан' : ''));
        h += '<li><button class="tile ' + cls + '"' + (t.soon ? ' disabled aria-disabled="true"' : ' data-go="/t/' + t.id + '"') + '>' +
          (p.passed ? '<span class="ok">' + ICON.check + '</span>' : '') +
          '<span class="tn">' + t.n + '</span>' +
          '<span class="tt">' + esc(t.title) + '</span>' +
          '<span class="ts">' + status + '</span></button></li>';
      });
      h += '</ul>';
    }
    return h + '</div>';
  }

  /* ---------- Тема по шагам ---------- */
  function viewTopic(id) {
    var t = BY_ID[id], d = DISC_BY[t.disc], p = prog(id);
    var n = t.steps.length;
    if (stepTopic !== id) {
      stepTopic = id;
      stepIdx = Math.max(0, Math.min(p.step || 0, n));
    }
    var last = stepIdx >= n;
    var pct = last ? 100 : Math.round(stepIdx / n * 100);

    var h = '<div style="' + discStyle(d) + '">';
    h += '<div class="topbar"><button class="icon-btn" data-go="/d/' + d.id + '" aria-label="Закрыть тему">' + ICON.close + '</button>' +
      '<div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + Math.min(stepIdx, n) + '" aria-label="Прогресс по теме"><i style="width:' + pct + '%"></i></div>' +
      '<span class="pcount">' + (last ? 'Итог' : (stepIdx + 1) + ' / ' + n) + '</span></div>';

    if (!last) {
      var s = t.steps[stepIdx];
      h += '<p class="ttl-sm">' + esc(t.title) + '</p>';
      if (stepIdx === 0) {
        h += '<p class="ttl-sm meta">Время чтения: около ' + t.min + ' ' + plural(t.min, 'минуты', 'минут', 'минут') + '</p>';
      }
      if (s.vis) {
        h += '<div class="card fit slide" id="step-vis" style="--cb:var(--c);--cf:var(--on)"><span class="chip">' + esc(s.h) + '</span>' +
          '<div class="vbox">' + s.html + '</div>' + (s.cap ? '<p class="cap">' + esc(s.cap) + '</p>' : '') + '</div>';
      } else {
        h += '<div class="card fit slide" id="step-text" style="--cb:var(--c);--cf:var(--on)">';
        if (s.h) h += '<span class="chip">' + esc(s.h) + '</span>';
        h += '<p>' + esc(s.text) + '</p>';
        if (s.links && s.links.length) {
          h += '<div class="links">' + s.links.map(function (l) {
            return '<a class="ext" target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?tbm=isch&q=' +
              encodeURIComponent(l.q) + '">' + esc(l.text) + ICON.ext + '</a>';
          }).join('') + '</div>';
        }
        h += '</div>';
      }
      h += '<div id="note-box" class="sheet" hidden><textarea id="note-input" placeholder="Что хочется запомнить или обдумать?" aria-label="Новая заметка"></textarea>' +
        '<button class="secondary" data-act="add-note">Сохранить заметку</button></div>';
    } else {
      h += '<div class="card slide" style="--cb:var(--c);--cf:var(--on)"><h2>Тема прочитана</h2>' +
        '<p>Вы прошли все ' + n + ' ' + plural(n, 'шаг', 'шага', 'шагов') + '. Добавьте заметку, если хочется что-то сохранить, а затем ответьте на три вопроса.</p></div>';
      h += '<h3 class="sub">Заметки и цитаты</h3>';
      h += '<textarea id="note-input" placeholder="Что хочется запомнить или обдумать?" aria-label="Новая заметка"></textarea>' +
        '<button class="secondary" data-act="add-note">Сохранить заметку</button>';
      h += '<div class="items" id="topic-items"></div>';
    }

    h += '<div class="footer"><div class="footer-in">';
    if (stepIdx > 0) h += '<button class="round" data-act="prev" aria-label="Предыдущий шаг">' + ICON.back + '</button>';
    if (!last) h += '<button class="round" data-act="toggle-note" aria-label="Записать мысль">' + ICON.pen + '</button>';
    if (last) h += '<button class="primary" data-act="finish">' + (p.passed ? 'Пройти тест ещё раз' : 'Тема изучена') + '</button>';
    else h += '<button class="primary" data-act="next-step">' + (stepIdx === n - 1 ? 'Закончить чтение' : 'Дальше') + '</button>';
    h += '</div></div></div>';
    return h;
  }

  function setStep(i) {
    var t = BY_ID[currentTopic];
    stepIdx = Math.max(0, Math.min(i, t.steps.length));
    var p = S.progress[currentTopic] || (S.progress[currentTopic] = {});
    p.step = stepIdx >= t.steps.length ? 0 : stepIdx;
    markToday();
    saveState();
    render(current);
  }

  /* ---------- Заметки и цитаты ---------- */
  function itemHtml(kind, it, withTopic) {
    var t = BY_ID[it.topicId];
    var pend = pendingDel === kind + it.id;
    var h = '<div class="item ' + (kind === 'quote' ? 'q' : 'n') + '"><p>' + esc(it.text) + '</p>';
    h += '<div class="row"><span>';
    if (withTopic && t) h += '<button class="topic-link" data-go="/t/' + t.id + '">' + esc(t.title) + '</button>, ';
    h += fmtDate(it.ts) + '</span>';
    h += '<button class="lnk' + (pend ? ' danger' : '') + '" data-act="del" data-kind="' + kind + '" data-id="' + it.id + '">' +
      (pend ? 'Точно удалить?' : 'Удалить') + '</button></div></div>';
    return h;
  }

  function refreshTopicItems() {
    var box = document.getElementById('topic-items');
    if (!box || !currentTopic) return;
    var items = [];
    S.quotes.forEach(function (q) { if (q.topicId === currentTopic) items.push({ kind: 'quote', it: q }); });
    S.notes.forEach(function (n) { if (n.topicId === currentTopic) items.push({ kind: 'note', it: n }); });
    items.sort(function (a, b) { return b.it.ts - a.it.ts; });
    box.innerHTML = items.length
      ? items.map(function (x) { return itemHtml(x.kind, x.it, false); }).join('')
      : '<p class="empty-sm">Пока пусто. Выделяйте фрагменты в шагах, и они появятся здесь.</p>';
  }

  function viewNotes() {
    var list = notesTab === 'notes' ? S.notes : S.quotes;
    var kind = notesTab === 'notes' ? 'note' : 'quote';
    var sorted = list.slice().sort(function (a, b) { return b.ts - a.ts; });
    var h = '<div class="topbar"><button class="icon-btn" data-go="/" aria-label="Назад">' + ICON.back + '</button></div>';
    h += '<h1 style="font-size:34px">Заметки и цитаты</h1>';
    h += '<div class="tabs" role="tablist">' +
      '<button class="tab" role="tab" data-act="tab" data-tab="notes" aria-selected="' + (notesTab === 'notes') + '">Заметки (' + S.notes.length + ')</button>' +
      '<button class="tab" role="tab" data-act="tab" data-tab="quotes" aria-selected="' + (notesTab === 'quotes') + '">Цитаты (' + S.quotes.length + ')</button></div>';
    if (!sorted.length) {
      h += '<p class="empty">' + (notesTab === 'notes'
        ? 'Заметок пока нет. Откройте тему и нажмите «Записать мысль».'
        : 'Цитат пока нет. Выделите фрагмент в тексте темы, и появится кнопка «Сохранить цитату».') + '</p>';
    } else {
      h += '<div class="items">' + sorted.map(function (it) { return itemHtml(kind, it, true); }).join('') + '</div>';
    }
    return h;
  }

  var pendingDel = null, pendingTimer;
  function handleDelete(kind, id) {
    var token = kind + id;
    if (pendingDel !== token) {
      pendingDel = token;
      clearTimeout(pendingTimer);
      pendingTimer = setTimeout(function () { pendingDel = null; refreshLists(); }, 3000);
      refreshLists();
      return;
    }
    pendingDel = null;
    clearTimeout(pendingTimer);
    if (kind === 'note') S.notes = S.notes.filter(function (n) { return n.id !== id; });
    else S.quotes = S.quotes.filter(function (q) { return q.id !== id; });
    saveState();
    refreshLists();
    toast('Удалено');
  }
  function refreshLists() {
    if (currentTopic) refreshTopicItems();
    else if (current === '/notes') render(current, true);
  }

  function addNote() {
    var input = document.getElementById('note-input');
    if (!input || !currentTopic) return;
    var text = input.value.trim();
    if (!text) { toast('Сначала напишите заметку'); input.focus(); return; }
    S.notes.push({ id: uid(), topicId: currentTopic, text: text, ts: Date.now() });
    saveState();
    input.value = '';
    var box = document.getElementById('note-box');
    if (box) box.hidden = true;
    refreshTopicItems();
    toast('Заметка сохранена');
  }

  /* ---------- Цитаты из текста ---------- */
  var pendingQuote = '';
  var hideTimer;
  function hideQuoteBar() {
    clearTimeout(hideTimer);
    quotebar.classList.remove('show');
    pendingQuote = '';
  }
  function scheduleHide() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      quotebar.classList.remove('show');
      pendingQuote = '';
    }, 700);
  }
  document.addEventListener('selectionchange', function () {
    if (!currentTopic) return;
    var sel = window.getSelection();
    var art = document.getElementById('step-text');
    if (!sel || sel.isCollapsed || !sel.rangeCount || !art) { scheduleHide(); return; }
    var range = sel.getRangeAt(0);
    if (!art.contains(range.commonAncestorContainer)) { scheduleHide(); return; }
    var text = sel.toString().replace(/\s+/g, ' ').trim();
    if (text.length < 8) { scheduleHide(); return; }
    pendingQuote = text;
    clearTimeout(hideTimer);
    quotebar.classList.add('show');
  });
  quotebar.addEventListener('pointerdown', function (e) { clearTimeout(hideTimer); e.preventDefault(); });

  function saveQuote() {
    if (!pendingQuote || !currentTopic) return;
    var dup = S.quotes.some(function (q) { return q.topicId === currentTopic && q.text === pendingQuote; });
    if (!dup) {
      S.quotes.push({ id: uid(), topicId: currentTopic, text: pendingQuote, ts: Date.now() });
      saveState();
      toast('Цитата сохранена');
    } else {
      toast('Эта цитата уже сохранена');
    }
    var sel = window.getSelection();
    if (sel && sel.removeAllRanges) sel.removeAllRanges();
    hideQuoteBar();
    refreshTopicItems();
  }

  /* ---------- Тест ---------- */
  function startQuiz(id) {
    var t = BY_ID[id];
    quiz = {
      id: id, i: 0, right: 0, chosen: null, finished: false,
      items: t.quiz.map(function (q) {
        var opts = [{ t: q.ok, ok: true }].concat(q.bad.map(function (b) { return { t: b, ok: false }; }));
        return { q: q.q, e: q.e, opts: shuffle(opts), correct: null };
      })
    };
  }

  function viewQuiz() {
    var t = BY_ID[quiz.id], d = DISC_BY[t.disc];
    var n = quiz.items.length;
    var h = '<div style="' + discStyle(d) + '">';
    if (quiz.finished) return h + viewResult(t) + '</div>';

    var it = quiz.items[quiz.i];
    var pct = Math.round((quiz.i + (quiz.chosen !== null ? 1 : 0)) / n * 100);
    h += '<div class="topbar"><button class="icon-btn" data-go="/t/' + t.id + '" aria-label="Вернуться к тексту">' + ICON.close + '</button>' +
      '<div class="pbar"><i style="width:' + pct + '%"></i></div>' +
      '<span class="pcount">' + (quiz.i + 1) + ' / ' + n + '</span></div>';
    h += '<div class="qcard"><h2>' + esc(it.q) + '</h2></div>';
    h += '<div class="opts">';
    it.opts.forEach(function (o, idx) {
      var cls = 'opt';
      if (quiz.chosen !== null) {
        if (o.ok) cls += ' ok';
        else if (idx === quiz.chosen) cls += ' no';
        else cls += ' dim';
      }
      h += '<button class="' + cls + '" data-act="opt" data-i="' + idx + '"' + (quiz.chosen !== null ? ' disabled' : '') + '>' + esc(o.t) + '</button>';
    });
    h += '</div>';
    if (quiz.chosen !== null) {
      var good = it.opts[quiz.chosen].ok;
      h += '<div class="fb ' + (good ? 'ok' : 'no') + '"><div class="fb-in"><h3>' + (good ? 'Верно' : 'Неверно') + '</h3><p>' + esc(it.e) + '</p>' +
        '<button class="primary" data-act="next">' + (quiz.i < n - 1 ? 'Дальше' : 'Показать результат') + '</button></div></div>';
    }
    return h + '</div>';
  }

  function viewResult(t) {
    var n = quiz.items.length;
    var ok = quiz.right === n;
    var h = '<div class="result"><div style="font-weight:700;margin-bottom:8px">' + (ok ? 'Тема пройдена' : 'Тема пока не засчитана') + '</div>';
    h += '<div class="big">' + quiz.right + ' из ' + n + '</div>';
    if (!ok) h += '<p>Чтобы тема засчиталась, нужно ответить правильно на все три вопроса. Перечитайте текст или попробуйте ещё раз.</p>';
    h += '</div>';
    h += '<ul class="review">';
    quiz.items.forEach(function (it) {
      var correct = it.opts.filter(function (o) { return o.ok; })[0].t;
      h += '<li class="' + (it.correct ? 'ok' : 'no') + '">' + esc(it.q) +
        '<small>' + (it.correct ? esc(correct) : 'Верный ответ: ' + esc(correct)) + '</small></li>';
    });
    h += '</ul><div class="stack">';
    if (ok) {
      h += '<button class="primary" data-go="/d/' + t.disc + '">К темам дисциплины</button>';
      h += '<button class="accent" data-act="random">Случайная тема</button>';
    } else {
      h += '<button class="primary" data-act="retry">Пересдать тест</button>';
      h += '<button class="secondary" data-act="reread">Перечитать тему</button>';
    }
    return h + '</div>';
  }

  function finishQuiz() {
    quiz.finished = true;
    var p = S.progress[quiz.id] || (S.progress[quiz.id] = {});
    p.read = true;
    p.attempts = (p.attempts || 0) + 1;
    p.best = Math.max(p.best || 0, quiz.right);
    var perfect = quiz.right === quiz.items.length;
    if (perfect && !p.passed) {
      p.passed = true;
      p.passedAt = Date.now();
      if (S.settings.spaced) initRep(quiz.id);
    } else if (perfect && p.passed && p.restudy) {
      p.restudy = false;
      if (S.settings.spaced) initRep(quiz.id);
    }
    markToday();
    saveState();
  }

  /* ======================= Повторение ======================= */
  var HOUR = 3600 * 1000, DAY = 24 * HOUR;
  var INTERVALS = [36 * HOUR, 7 * DAY, 21 * DAY, 60 * DAY];
  var INTERVAL_NAMES = ['36 часов', '7 дней', '21 день', '60 дней'];
  var GRACE = 3 * DAY;
  var rev = null;

  function initRep(id) {
    var p = S.progress[id] || (S.progress[id] = {});
    p.rep = { t0: Date.now(), done: [null, null, null, null], warnAt: null };
  }
  function dueItems() {
    var now = Date.now(), out = [];
    Object.keys(S.progress).forEach(function (id) {
      var p = S.progress[id];
      if (!p || !p.passed || !p.rep || !BY_ID[id]) return;
      for (var i = 0; i < 4; i++) {
        if (!p.rep.done[i] && p.rep.t0 + INTERVALS[i] <= now) out.push({ topicId: id, idx: i, due: p.rep.t0 + INTERVALS[i] });
      }
    });
    out.sort(function (x, y) { return x.due - y.due; });
    return out;
  }
  function dueTopicCount() {
    var seen = {};
    dueItems().forEach(function (it) { seen[it.topicId] = 1; });
    return Object.keys(seen).length;
  }
  function nextDue() {
    var best = null;
    Object.keys(S.progress).forEach(function (id) {
      var p = S.progress[id];
      if (!p || !p.passed || !p.rep || !BY_ID[id]) return;
      for (var i = 0; i < 4; i++) {
        if (!p.rep.done[i]) { var t = p.rep.t0 + INTERVALS[i]; if (t > Date.now() && (best === null || t < best)) best = t; break; }
      }
    });
    return best;
  }
  function setSpaced(on) {
    S.settings.spaced = !!on;
    if (on) {
      Object.keys(S.progress).forEach(function (id) {
        var p = S.progress[id];
        if (p && p.passed && BY_ID[id]) { if (!p.rep) initRep(id); else p.rep.warnAt = null; }
      });
    }
    saveState();
  }

  function notify(title, body, tag) {
    try {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      var opts = { body: body, icon: 'thesis-icon-192.png', tag: tag || 'thesis' };
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
        navigator.serviceWorker.getRegistration().then(function (r) {
          if (r && r.showNotification) r.showNotification(title, opts); else new Notification(title, opts);
        }).catch(function () { try { new Notification(title, opts); } catch (e) { /* нет */ } });
      } else { new Notification(title, opts); }
    } catch (e) { /* уведомления недоступны */ }
  }

  /* Проверка предупреждений и «слёта» тем */
  function checkRepetition() {
    if (!S.settings.spaced) return false;
    var now = Date.now(), changed = false;
    Object.keys(S.progress).forEach(function (id) {
      var p = S.progress[id];
      if (!p || !p.passed || !p.rep || !BY_ID[id]) return;
      var n = 0;
      for (var i = 0; i < 4; i++) if (!p.rep.done[i] && p.rep.t0 + INTERVALS[i] <= now) n++;
      if (n >= 2 && !p.rep.warnAt) {
        p.rep.warnAt = now; changed = true;
        notify('Скоро слетит тема', '«' + BY_ID[id].title + '»: ответьте на вопросы повторения в течение 3 дней.', 'warn-' + id);
      } else if (p.rep.warnAt && n < 2) {
        p.rep.warnAt = null; changed = true;
      } else if (p.rep.warnAt && now >= p.rep.warnAt + GRACE) {
        p.passed = false; p.read = false; p.step = 0; p.restudy = false; delete p.rep;
        S.alerts.push({ id: uid(), topicId: id, text: 'Тема «' + BY_ID[id].title + '» снова стала непройденной: вопросы повторения остались без ответа.', ts: now });
        notify('Тема снова непройденная', '«' + BY_ID[id].title + '»: изучите её и пройдите тест заново.', 'lost-' + id);
        changed = true;
      }
    });
    if (changed) saveState();
    return changed;
  }
  function refreshHome() { if (current === '/' || current === '/review' || current === '/settings') render(current, true); }

  function alertsHtml() {
    var h = '';
    if (S.settings.spaced) {
      Object.keys(S.progress).forEach(function (id) {
        var p = S.progress[id];
        if (p && p.passed && p.rep && p.rep.warnAt && BY_ID[id]) {
          var left = Math.max(0, p.rep.warnAt + GRACE - Date.now());
          var days = Math.ceil(left / DAY);
          h += '<div class="alert warnb"><b>Скоро слетит тема</b>«' + esc(BY_ID[id].title) + '». Ответьте на вопросы повторения, осталось ' + days + ' ' + plural(days, 'день', 'дня', 'дней') + '.</div>';
        }
      });
    }
    S.alerts.forEach(function (al) {
      h += '<div class="alert lostb"><p>' + esc(al.text) + '</p><button class="lnk" data-act="dismiss-alert" data-id="' + al.id + '">Понятно</button></div>';
    });
    return h;
  }

  /* ----- Экран «Повторить изученное» ----- */
  function passedIds() {
    return ALL.filter(function (t) { return isPassed(t.id) && REVIEW_DATA[t.id]; }).map(function (t) { return t.id; });
  }
  function fmtWhen(ts) {
    try { return new Date(ts).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
  }
  function viewReviewStart() {
    var spaced = S.settings.spaced, ids = passedIds();
    var h = '<div class="topbar"><button class="icon-btn" data-go="/" aria-label="Назад">' + ICON.back + '</button></div>';
    h += '<h1 style="font-size:34px">Повторить изученное</h1>';
    if (!ids.length) {
      h += '<p class="empty">Пока нет пройденных тем. Пройдите тест хотя бы по одной теме, и здесь появятся вопросы для повторения.</p>';
      return h;
    }
    if (spaced) {
      var due = dueItems(), topics = dueTopicCount();
      if (due.length) {
        h += '<div class="result" style="--c:#FFC341;--on:#232227;margin-top:18px"><div style="font-weight:700;margin-bottom:6px">Интервальное повторение</div><div class="big">' + topics + '</div><p>' +
          plural(topics, 'тема ждёт повторения', 'темы ждут повторения', 'тем ждут повторения') + ', вопросов: ' + due.length + '.</p></div>';
        h += '<div class="stack"><button class="primary" data-act="start-due">Начать повторение</button></div>';
      } else {
        var nd = nextDue();
        h += '<div class="result" style="--c:#B7CB7A;--on:#232227;margin-top:18px"><div style="font-weight:700;margin-bottom:6px">Всё повторено</div><p>Сейчас вопросов для повторения нет.' +
          (nd ? ' Ближайшее повторение: ' + esc(fmtWhen(nd)) + '.' : '') + '</p></div>';
        h += '<div class="stack"><button class="secondary" data-act="start-free">Потренироваться без учёта</button></div>';
      }
    } else {
      h += '<p class="lead2">Интервальное повторение выключено. Вопросы выбираются случайно из пройденных тем и ни на что не влияют.</p>';
      h += '<div class="stack"><button class="primary" data-act="start-free">Начать тренировку</button>' +
        '<button class="secondary" data-go="/settings">Включить интервальное повторение</button></div>';
    }
    return h;
  }

  function buildItem(topicId, idx, free) {
    var raw = (REVIEW_DATA[topicId] || [])[idx];
    if (!raw) return null;
    var it = { topicId: topicId, idx: idx, free: !!free, type: raw[0], chosen: null, correct: null };
    if (raw[0] === 'q') {
      it.q = raw[1]; it.e = raw[4];
      it.opts = shuffle([{ t: raw[2], ok: true }].concat(raw[3].map(function (b) { return { t: b, ok: false }; })));
    } else if (raw[0] === 'c') {
      it.cs = raw[1]; it.q = raw[2]; it.e = raw[5];
      it.opts = shuffle([{ t: raw[3], ok: true }].concat(raw[4].map(function (b) { return { t: b, ok: false }; })));
    } else {
      it.q = raw[1]; it.e = raw[4]; it.truth = raw[2]; it.reason = raw[3];
      it.opts = [{ t: 'Правда', ok: raw[2] === true }, { t: 'Ложь: ' + raw[3], ok: raw[2] === false }];
    }
    return it;
  }
  function startReview(mode) {
    var items = [];
    if (mode === 'due') {
      dueItems().forEach(function (d) { var it = buildItem(d.topicId, d.idx, false); if (it) items.push(it); });
    } else {
      shuffle(passedIds()).slice(0, 8).forEach(function (id) {
        var it = buildItem(id, Math.floor(Math.random() * 4), true); if (it) items.push(it);
      });
    }
    if (!items.length) { toast('Пока нечего повторять'); return; }
    rev = { mode: mode, items: items, i: 0, right: 0, finished: false };
    navigate('/rv');
  }

  function viewReviewSession() {
    var n = rev.items.length;
    if (rev.finished) return viewReviewResult();
    var it = rev.items[rev.i], t = BY_ID[it.topicId], d = DISC_BY[t.disc];
    var pct = Math.round((rev.i + (it.chosen !== null ? 1 : 0)) / n * 100);
    var h = '<div style="' + discStyle(d) + '">';
    h += '<div class="topbar"><button class="icon-btn" data-act="rv-exit" aria-label="Выйти из повторения">' + ICON.close + '</button>' +
      '<div class="pbar"><i style="width:' + pct + '%"></i></div><span class="pcount">' + (rev.i + 1) + ' / ' + n + '</span></div>';
    h += '<p class="ttl-sm" style="margin-bottom:10px">' + esc(t.title) + '</p>';
    h += '<div class="qcard">';
    if (it.type === 'c') h += '<span class="chip">Кейс</span><p class="casep">' + esc(it.cs) + '</p><h2>' + esc(it.q) + '</h2>';
    else if (it.type === 'tf') h += '<span class="chip">Правда или ложь?</span><h2>' + esc(it.q) + '</h2>';
    else h += '<h2>' + esc(it.q) + '</h2>';
    h += '</div><div class="opts">';
    it.opts.forEach(function (o, idx) {
      var cls = 'opt';
      if (it.chosen !== null) { if (o.ok) cls += ' ok'; else if (idx === it.chosen) cls += ' no'; else cls += ' dim'; }
      h += '<button class="' + cls + '" data-act="rv-opt" data-i="' + idx + '"' + (it.chosen !== null ? ' disabled' : '') + '>' + esc(o.t) + '</button>';
    });
    h += '</div>';
    if (it.chosen !== null) {
      var good = it.correct;
      h += '<div class="fb ' + (good ? 'ok' : 'no') + '"><div class="fb-in"><h3>' + (good ? 'Верно' : 'Неверно') + '</h3><p>' + esc(it.e) + '</p>';
      if (!good) h += '<p style="font-weight:700">Тема остаётся пройденной. Лучше изучить её ещё раз.</p>';
      h += '<button class="primary" data-act="rv-next">' + (rev.i < n - 1 ? 'Дальше' : 'Показать результат') + '</button>';
      if (!good) h += '<button class="secondary" style="margin-top:8px" data-go="/t/' + t.id + '">Изучить тему снова</button>';
      h += '</div></div>';
    }
    return h + '</div>';
  }
  function viewReviewResult() {
    var n = rev.items.length;
    var h = '<div style="' + discStyle(DISC[0]) + '"><div class="result"><div style="font-weight:700;margin-bottom:8px">Повторение завершено</div><div class="big">' + rev.right + ' из ' + n + '</div></div>';
    var wrong = rev.items.filter(function (x) { return !x.correct; });
    if (wrong.length) {
      h += '<h3 class="sub">Стоит изучить снова</h3><ul class="review">';
      var seen = {};
      wrong.forEach(function (x) {
        if (seen[x.topicId]) return; seen[x.topicId] = 1;
        h += '<li class="no">' + esc(BY_ID[x.topicId].title) + '<small><button class="topic-link" data-go="/t/' + x.topicId + '">Изучить тему</button></small></li>';
      });
      h += '</ul>';
    }
    h += '<div class="stack"><button class="primary" data-go="/">На главный экран</button></div></div>';
    return h;
  }

  /* ----- Настройки ----- */
  function viewSettings() {
    var on = S.settings.spaced;
    var perm = ('Notification' in window) ? Notification.permission : 'unsupported';
    var h = '<div class="topbar"><button class="icon-btn" data-go="/" aria-label="Назад">' + ICON.back + '</button></div>';
    h += '<h1 style="font-size:34px">Настройки</h1>';
    h += '<div class="setcard"><div class="setrow"><div><b>Интервальное повторение</b></div>' +
      '<button class="switch" role="switch" aria-checked="' + on + '" aria-label="Интервальное повторение" data-act="toggle-spaced"><i></i></button></div>';
    h += '<p>Метод запоминания: тема повторяется не сразу, а через всё более длинные промежутки времени, пока знание не закрепится надолго. Для каждой пройденной темы подготовлено 4 вопроса, по одному на интервал.</p>';
    h += '<ul class="intl">' +
      '<li><b>Через 36 часов</b>первый пик забывания: исчезает около 70 % деталей</li>' +
      '<li><b>Через 7 дней</b>закрепление концепции в долговременной памяти</li>' +
      '<li><b>Через 21 день</b>проверка глубинного понимания</li>' +
      '<li><b>Через 60 дней</b>финальная реактивация ментальной модели</li></ul>';
    h += '<p>Время отсчитывается с момента, когда вы прошли тест по теме. На кнопке «Повторить изученное» показано число тем, которые пора повторить. Пропущенные вопросы не сгорают, а накапливаются.</p>';
    h += '<p>Если ответили неверно, тема остаётся пройденной, но вам предложат изучить её снова. Если по теме не отвечены два вопроса, придёт предупреждение, что тема скоро слетит. Если за 3 дня после предупреждения вопросы остались без ответа, тема снова станет непройденной.</p>';
    h += '<p>Когда переключатель выключен, кнопка просто задаёт случайные вопросы по пройденным темам: без счётчика, предупреждений и потери прогресса.</p></div>';
    h += '<div class="setcard"><b>Уведомления</b>';
    if (perm === 'unsupported') h += '<p>Этот браузер не поддерживает уведомления. Предупреждения будут показываться на главном экране.</p>';
    else if (perm === 'granted') h += '<p>Уведомления разрешены.</p>';
    else if (perm === 'denied') h += '<p>Уведомления запрещены в настройках браузера или телефона. Предупреждения будут показываться на главном экране.</p>';
    else h += '<p>Разрешите уведомления, чтобы получать предупреждения о том, что тема скоро слетит.</p><button class="secondary" data-act="ask-notify">Разрешить уведомления</button>';
    h += '<p class="fine">Уведомления приходят, когда приложение открыто или работает в фоне. Постоянные push-уведомления при полностью закрытом приложении требуют серверной части, которой в этой версии нет, поэтому предупреждение в любом случае появится на главном экране при открытии.</p></div>';
    return h;
  }

  /* ---------- Случайная тема ---------- */
  function randomTopic() {
    if (!ALL.length) { toast('Пока нет тем'); return; }
    var fresh = ALL.filter(function (t) { return !isPassed(t.id); });
    var pool = fresh.length ? fresh : ALL;
    var t = pool[Math.floor(Math.random() * pool.length)];
    stepTopic = null;
    navigate('/t/' + t.id);
  }

  /* ---------- События ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-go],[data-act]');
    if (!el) return;
    if (el.dataset.go) {
      if (el.dataset.go.indexOf('/t/') === 0) stepTopic = null;
      navigate(el.dataset.go);
      return;
    }
    var act = el.dataset.act;
    if (act === 'random') randomTopic();
    else if (act === 'add-note') addNote();
    else if (act === 'save-quote') saveQuote();
    else if (act === 'del') handleDelete(el.dataset.kind, el.dataset.id);
    else if (act === 'tab') { notesTab = el.dataset.tab; render(current, true); }
    else if (act === 'start-due') startReview('due');
    else if (act === 'start-free') startReview('free');
    else if (act === 'rv-exit') { rev = null; navigate('/'); }
    else if (act === 'rv-opt') {
      if (!rev) return;
      var rit = rev.items[rev.i];
      if (rit.chosen !== null) return;
      var ri = Number(el.dataset.i);
      rit.chosen = ri; rit.correct = !!rit.opts[ri].ok;
      if (rit.correct) rev.right++;
      if (!rit.free) {
        var rp = S.progress[rit.topicId];
        if (rp && rp.rep) { rp.rep.done[rit.idx] = { ts: Date.now(), ok: rit.correct }; if (!rit.correct) rp.restudy = true; }
        markToday();
        saveState();
        checkRepetition();
      }
      render(current, true);
    }
    else if (act === 'rv-next') {
      if (rev.i < rev.items.length - 1) rev.i++; else rev.finished = true;
      render(current);
    }
    else if (act === 'toggle-spaced') { setSpaced(!S.settings.spaced); render(current, true); }
    else if (act === 'ask-notify') {
      try { Notification.requestPermission().then(function () { render(current, true); }); } catch (e) { toast('Не удалось запросить разрешение'); }
    }
    else if (act === 'dismiss-alert') { S.alerts = S.alerts.filter(function (x) { return x.id !== el.dataset.id; }); saveState(); render(current, true); }
    else if (act === 'toggle-note') {
      var box = document.getElementById('note-box');
      if (box) {
        box.hidden = !box.hidden;
        if (!box.hidden) document.getElementById('note-input').focus();
      }
    }
    else if (act === 'next-step') setStep(stepIdx + 1);
    else if (act === 'prev') setStep(stepIdx - 1);
    else if (act === 'finish') {
      var p = S.progress[currentTopic] || (S.progress[currentTopic] = {});
      p.read = true;
      p.step = 0;
      saveState();
      startQuiz(currentTopic);
      navigate('/q/' + currentTopic);
    }
    else if (act === 'opt') {
      if (!quiz || quiz.chosen !== null) return;
      var idx = Number(el.dataset.i);
      var it = quiz.items[quiz.i];
      quiz.chosen = idx;
      it.correct = it.opts[idx].ok;
      if (it.correct) quiz.right++;
      render(current, true);
    }
    else if (act === 'next') {
      if (quiz.i < quiz.items.length - 1) { quiz.i++; quiz.chosen = null; }
      else finishQuiz();
      render(current);
    }
    else if (act === 'retry') { startQuiz(quiz.id); render(current); }
    else if (act === 'reread') { stepTopic = null; var q = S.progress[quiz.id]; if (q) q.step = 0; navigate('/t/' + quiz.id); }
  });

  window.addEventListener('hashchange', function () { route(readHash()); });

  /* ---------- Запуск ---------- */
  loadState().then(function (saved) {
    if (saved && typeof saved === 'object') {
      S.progress = saved.progress || {};
      S.notes = saved.notes || [];
      S.quotes = saved.quotes || [];
      S.days = saved.days || {};
      S.settings = saved.settings || { spaced: false };
      S.alerts = saved.alerts || [];
    }
    window.REVIEW_DATA_READY = true;
    checkRepetition();
    render(readHash());
    setInterval(function () { if (checkRepetition()) refreshHome(); }, 60000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && checkRepetition()) refreshHome(); });
  }).catch(function () { render(readHash()); });
})();

/* Офлайн-режим: работает, когда страница открыта по адресу http(s), например на GitHub Pages */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* без офлайн-режима приложение всё равно работает */ });
  });
}
</script>
</body>
